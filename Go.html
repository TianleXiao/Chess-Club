<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Go Studio - Monochromatic Masterpiece Pro</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #141418;
            --surface-sub: #1e1e24;
            --border: #2c2c35;
            --text-main: #f0f0f0;
            --text-dim: #888899;
            --board-line: #444455;
            --star-point: #666677;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --cell-size: 28px; /* Optimized scale for 19x19 standard board */
            --board-pad: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Left Control Panel */
        .sidebar { width: 340px; background-color: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; justify-content: space-between; z-index: 10; }
        .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 24px; background: linear-gradient(135deg, #fff 0%, #888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .brand::before { content: ''; display: inline-block; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .panel-section { background-color: var(--surface-sub); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; letter-spacing: 0.5px; }
        
        .room-display { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); font-family: monospace; font-size: 15px; cursor: pointer; transition: all var(--ease); }
        .room-display:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
        
        .input-group { display: flex; gap: 8px; }
        .modern-input { flex: 1; background-color: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; transition: all var(--ease); }
        .modern-input:focus { outline: none; border-color: #555; background-color: rgba(0,0,0,0.5); }
        
        .btn { background: #fff; color: #000; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all var(--ease); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { background: #ececec; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: var(--surface-sub); color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }
        .btn-danger { background: #ff4d4d; color: #fff; }
        .btn-danger:hover { background: #ff6666; }
        
        .status-container { display: flex; flex-direction: column; gap: 8px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .status-badge { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-badge.connected { background: rgba(46, 204, 113, 0.1); border-color: rgba(46, 204, 113, 0.3); color: #2ecc71; }
        .status-badge.local-mode { background: rgba(52, 152, 219, 0.1); border-color: rgba(52, 152, 219, 0.3); color: #3498db; }
        .status-badge.your-turn { background: rgba(241, 196, 15, 0.1); border-color: rgba(241, 196, 15, 0.3); color: #f1c40f; animation: pulse 2s infinite; }

        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 10px rgba(241,196,15,0.2); } 100% { opacity: 0.8; } }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .stat-item { background: rgba(0,0,0,0.15); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .stat-val { font-size: 16px; font-weight: 700; margin-top: 2px; }
        .stat-lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }

        .log-panel { flex: 1; min-height: 100px; display: flex; flex-direction: column; }
        .log-box { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #aaa; overflow-y: auto; line-height: 1.6; word-break: break-all; }

        /* Toggle Switch */
        .switch-container { display: flex; align-items: center; justify-content: space-between; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); border: 1px solid var(--border); transition: .3s var(--ease); border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: #888; transition: .3s var(--ease); border-radius: 50%; }
        input:checked + .slider { background-color: #fff; border-color: #fff; }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }

        /* Main Workspace Container */
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at center, #181820 0%, #0a0a0c 100%); }

        /* Risk Interruption Banner */
        .danger-banner { position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(to right, #ff4d4d, #cc1111); color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; transform: translateY(-100%); transition: transform 0.4s var(--ease); z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .danger-banner.active { transform: translateY(0); }
        .danger-msg { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 14px; }
        .danger-msg::before { content: '⚠️'; font-size: 18px; }
        .danger-actions { display: flex; gap: 10px; }

        /* Go Board Layout Archetype */
        .board-container { position: relative; padding: var(--board-pad); background-color: #1a1a22; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 1px 1px rgba(255,255,255,0.1); border: 1px solid rgba(0,0,0,0.6); }
        
        /* Calculated precise bound size for 19x19 spacing grid */
        .board-wrapper { position: relative; width: calc((19 - 1) * 28px); height: calc((19 - 1) * 28px); }
        
        .svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .dom-interaction-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Coordinate hit-boxes deployed exactly focused over wireframe intersections */
        .intersection { position: absolute; width: 26px; height: 26px; transform: translate(-50%, -50%); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; z-index: 5; }
        .intersection:hover::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); }
        .intersection.has-stone:hover::after { display: none; }

        /* Stone Vector Modeling Geometry */
        .stone { width: 23px; height: 23px; border-radius: 50%; animation: dropStone 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; shadow: 0 3px 6px rgba(0,0,0,0.4); position: relative; z-index: 6; }
        .stone.black { background: radial-gradient(circle at 35% 35%, #3a3a44 0%, #0d0d11 60%, #000000 100%); box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 -1px 2px rgba(0,0,0,0.4); }
        .stone.white { background: radial-gradient(circle at 30% 30%, #ffffff 0%, #eaeaea 50%, #b5b5bc 100%); box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 -1px 1px rgba(0,0,0,0.2); }
        
        @keyframes dropStone { 0% { transform: scale(1.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Last played move indicator ring marker */
        .last-move::before { content: ''; width: 6px; height: 6px; border-radius: 50%; position: absolute; z-index: 10; pointer-events: none; }
        .intersection.last-move .stone.black::before { background: #fff; left: calc(50% - 3px); top: calc(50% - 3px); }
        .intersection.last-move .stone.white::before { background: #000; left: calc(50% - 3px); top: calc(50% - 3px); }

        /* Assist Engine Recommendation Indicator Ring Overlay */
        .intersection.assist-suggest::after { content: ''; width: 14px; height: 14px; border: 2.5px solid #a855f7; border-radius: 50%; position: absolute; z-index: 12; animation: assistPulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; pointer-events: none; }
        @keyframes assistPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.4; } }

        /* Real-time Stone Balance Matrix Analytics Evaluator */
        .evaluator-bar-container { width: calc(((19 - 1) * 28px) + (var(--board-pad) * 2)); background-color: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-top: 24px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .evaluator-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .eval-lbl-black { color: #fff; display: flex; align-items: center; gap: 6px; }
        .eval-lbl-black::before { content: ''; display:inline-block; width: 8px; height: 8px; background:#fff; border-radius:50%; }
        .eval-lbl-white { color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
        .eval-lbl-white::before { content: ''; display:inline-block; width: 8px; height: 8px; background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4); border-radius:50%; }
        .eval-track { height: 6px; background-color: rgba(255,255,255,0.05); border-radius: 3px; display: flex; overflow: hidden; border: 1px solid rgba(255,255,255,0.02); }
        .eval-fill { height: 100%; transition: width 0.6s var(--ease); }
        .eval-fill.black-fill { background-color: #fff; width: 50%; }
        .eval-fill.white-fill { background-color: #33333c; width: 50%; }

        /* Global Structural Utilities */
        .flex-spacer { flex-grow: 1; }
        .panel-footer-branding { text-align: center; font-size: 10px; color: rgba(255,255,255,0.15); font-family: monospace; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 16px; margin-top: 16px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">P2P GO STUDIO Pro</div>
            
            <div class="panel-section">
                <div class="section-title">分布式网络棋室密钥</div>
                <div class="room-display" onclick="copyRoomKey()" title="点击一键拷贝专属棋室钥匙">
                    <span id="myIdDisplay">Generating Token...</span>
                    <span style="font-size:12px; color:var(--text-dim)">📋</span>
                </div>
                <div class="section-title" style="margin-top: 14px; margin-bottom: 8px;">联入远程总线端点</div>
                <div class="input-group">
                    <input type="text" id="peerIdInput" class="modern-input" placeholder="输入对家棋室密钥...">
                    <button class="btn" onclick="connectToPeer()">加入对局</button>
                </div>
            </div>

            <div class="panel-section">
                <div class="section-title">实时拓扑状态总线</div>
                <div class="status-container">
                    <div class="status-row">
                        <span>联通架构:</span>
                        <span id="connectionStatus" class="status-badge local-mode">网络初始化...</span>
                    </div>
                    <div class="status-row">
                        <span>分配阵营:</span>
                        <span id="roleStatus" class="status-badge" style="display: none;">观战席位</span>
                    </div>
                    <div class="status-row">
                        <span>控制权属:</span>
                        <span id="turnStatus" class="status-badge">等待就绪</span>
                    </div>
                </div>
            </div>

            <div class="panel-section switch-container">
                <div>
                    <div style="font-size: 13px; font-weight: 600;">KataGo 引擎辅助</div>
                    <div style="font-size: 11px; color: var(--text-dim); margin-top: 1px;">实时紫圈推荐与胜率分析</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="assistToggle" onchange="toggleAssistMode(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="panel-section">
                <div class="section-title">本地历史胜负结算</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-lbl">胜场</div><div class="stat-val" id="statWins" style="color:#2ecc71">0</div></div>
                    <div class="stat-item"><div class="stat-lbl">负场</div><div class="stat-val" id="statLosses" style="color:#ff4d4d">0</div></div>
                    <div class="stat-item"><div class="stat-lbl">胜率</div><div class="stat-val" id="statRate">0%</div></div>
                </div>
            </div>
        </div>

        <div class="log-panel">
            <div class="section-title">控制台链路日志跟踪</div>
            <div class="log-box" id="logBox">系统总线就绪。等待玩家策略部署...</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn btn-secondary" onclick="requestUndo()">申请悔棋</button>
                <button class="btn btn-secondary" onclick="sendPass()">过牌/停手</button>
            </div>
            <button class="btn btn-danger" onclick="initBoard()">清空盘面 / 重启棋局</button>
            <div class="panel-footer-branding">ENGINE COUPLING ARCHITECTURE V2.1.0</div>
        </div>
    </div>

    <div class="workspace">
        
        <div class="danger-banner" id="dangerBanner">
            <div class="danger-msg">防自杀/无气风险拦截：检测到该落子交叉点处于“无气自杀”或非法禁着点状态。</div>
            <div class="danger-actions">
                <button class="btn btn-secondary" style="background: rgba(255,255,255,0.15); color: #fff; border: none;" onclick="cancelPendingMove()">撤销操作</button>
                <button class="btn" id="dangerConfirmBtn" style="background: #fff; color: #000;">强行落子</button>
            </div>
        </div>

        <div class="board-container">
            <div class="board-wrapper" id="boardWrapper">
                <div class="dom-interaction-grid" id="board">
                    </div>
            </div>
        </div>

        <div class="evaluator-bar-container">
            <div class="evaluator-meta">
                <div class="eval-lbl-black" id="blackEvalText">0 Black</div>
                <div class="eval-lbl-white" id="whiteEvalText">0 White</div>
            </div>
            <div class="eval-track">
                <div class="eval-fill black-fill" id="blackEvalBar"></div>
                <div class="eval-fill white-fill" id="whiteEvalBar"></div>
            </div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 19;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let myRole = null; 
        let currentTurn = 'black'; // Black plays first in Go standard rule matrix
        let lastMove = null;
        let moveHistory = [];
        let assistModeActive = false;
        let pendingMoveContext = null;

        // MQTT Network core variables
        let mqttClient = null;
        let currentRoomTopic = '';
        const myUniqueId = 'UID_' + Math.random().toString(36).substr(2, 9);
        let myRoomId = '';

        let matchStats = JSON.parse(localStorage.getItem('go_p2p_stats')) || { wins: 0, losses: 0 };

        // 9 Standard Star Points (星位) for 19x19 Grid Matrix
        const starPoints = [
            {r: 3, c: 3}, {r: 3, c: 9}, {r: 3, c: 15},
            {r: 9, c: 3}, {r: 9, c: 9}, {r: 9, c: 15},
            {r: 15, c: 3}, {r: 15, c: 9}, {r: 15, c: 15}
        ];

        // ==========================================
        // 围棋 GTP 标准坐标转换矩阵 (排除了混淆字母 "I")
        // ==========================================
        const GTP_LETTERS = "ABCDEFGHJKLMNOPQRST";

        // 将前端 19x19 二维数组的 (r, c) 坐标转换为 KataGo 识别的 "D14"、"Q16" 等标准字符串
        function coordsToGtp(r, c) {
            const letter = GTP_LETTERS[c];
            const number = 19 - r; // 数组第 0 行对应围棋最顶部的第 19 行
            return letter + number;
        }

        // 将 KataGo 返回的 "D14" 还原为前端渲染所需的二维数组坐标 { r, c }
        function gtpToCoords(gtpStr) {
            if (!gtpStr || gtpStr === '(none)' || gtpStr === 'pass') return null;
            const letter = gtpStr[0].toUpperCase();
            const number = parseInt(gtpStr.substring(1));
            const c = GTP_LETTERS.indexOf(letter);
            const r = 19 - number;
            return { r, c };
        }

        // 获取当前棋局全量落子顺序数组，例如: ["D4", "Q16", "R10"]
        function getFullGtpMovesHistory() {
            return moveHistory.map((snapshot, index) => {
                const nextSnapshot = moveHistory[index + 1];
                const lm = nextSnapshot ? nextSnapshot.lastMove : lastMove;
                return lm ? coordsToGtp(lm.r, lm.c) : null;
            }).filter(m => m !== null);
        }

        function renderSVGBoard() {
            const CS = 28; 
            const w = (BOARD_SIZE - 1) * CS; 
            const h = (BOARD_SIZE - 1) * CS; 
            const strokeColor = "var(--board-line)";
            
            let svgStr = `<svg class="svg-layer" width="${w + 2}" height="${h + 2}" viewBox="-1 -1 ${w + 2} ${h + 2}" xmlns="http://www.w3.org/2000/svg">`;
            
            // Draw grid lines
            for (let i = 0; i < BOARD_SIZE; i++) {
                // Horizontal line
                svgStr += `<line x1="0" y1="${i * CS}" x2="${w}" y2="${i * CS}" stroke="${strokeColor}" stroke-width="1"/>`;
                // Vertical line
                svgStr += `<line x1="${i * CS}" y1="0" x2="${i * CS}" y2="${h}" stroke="${strokeColor}" stroke-width="1"/>`;
            }

            // Draw star points (星位)
            starPoints.forEach(p => {
                svgStr += `<circle cx="${p.c * CS}" cy="${p.r * CS}" r="3.5" fill="var(--star-point)"/>`;
            });

            svgStr += `</svg>`;
            
            // Cleanup old SVGs if exist
            const oldSvg = document.querySelector('.svg-layer');
            if (oldSvg) oldSvg.remove();
            
            document.getElementById('boardWrapper').insertAdjacentHTML('afterbegin', svgStr);
        }

        function createDOMGrid() {
            const boardDOM = document.getElementById('board'); 
            boardDOM.innerHTML = '';
            const CS = 28;
            
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = document.createElement('div');
                    hitBox.className = 'intersection';
                    hitBox.style.left = `${c * CS}px`;
                    hitBox.style.top = `${r * CS}px`;
                    hitBox.dataset.row = r;
                    hitBox.dataset.col = c;
                    
                    hitBox.addEventListener('click', () => handleIntersectionClick(r, c));
                    boardDOM.appendChild(hitBox);
                }
            }
        }

        function initNetwork() {
            myRoomId = 'GO-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('myIdDisplay').innerText = myRoomId;
            currentRoomTopic = `go/room/${myRoomId}`;

            log("正在连接分布式数据通道...");
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                log("网关中转联通成功。正在守候远程节点...");
                mqttClient.subscribe(currentRoomTopic);
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.senderId === myUniqueId) return;
                    handleNetworkData(data);
                } catch (e) { console.error(e); }
            });
        }

        function connectToPeer() {
            const remoteId = document.getElementById('peerIdInput').value.trim();
            if (!remoteId) return alert("请输入合法的棋室密钥！");
            if (remoteId === myRoomId) return alert("无法加入您本地的棋局房间！");

            log(`切换网络信道至对端总线: ${remoteId}...`);
            mqttClient.unsubscribe(currentRoomTopic);
            currentRoomTopic = `go/room/${remoteId}`;
            mqttClient.subscribe(currentRoomTopic);

            myRole = 'white';
            sendMqttMessage('join');
        }

        function sendMqttMessage(type, extraPayload = {}) {
            if (!mqttClient || !currentRoomTopic) return;
            const messageObj = { type: type, senderId: myUniqueId, ...extraPayload };
            mqttClient.publish(currentRoomTopic, JSON.stringify(messageObj));
        }

        function handleNetworkData(data) {
            if (data.type === 'join') {
                myRole = 'black';
                updateConnectionUI(true);
                initBoard();
                log("对方已连入房间。你执黑子(先手)。");
                sendMqttMessage('join_ack');
            } else if (data.type === 'join_ack') {
                myRole = 'white';
                updateConnectionUI(true);
                initBoard();
                log("已成功加入对战。你执白子(后手)。");
            } else if (data.type === 'move') {
                executeMoveSync(data.r, data.c);
            } else if (data.type === 'pass') {
                log(`对方选择停手/过牌。`);
                currentTurn = currentTurn === 'black' ? 'white' : 'black';
                updateTurnUI();
            } else if (data.type === 'reset') {
                resetBoardLocal(); log("对方重启了棋局。");
            } else if (data.type === 'undo_request') {
                if (confirm("对方请求撤回一步，是否同意？")) {
                    executeUndoLocal(); sendMqttMessage('undo_response', { accept: true });
                } else { sendMqttMessage('undo_response', { accept: false }); }
            } else if (data.type === 'undo_response') {
                if (data.accept) { executeUndoLocal(); log("对方同意了你的悔棋申请。"); } else { log("悔棋被拒绝。"); }
            }
        }

        function initBoard() { resetBoardLocal(); sendMqttMessage('reset'); }

        function resetBoardLocal() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            currentTurn = 'black'; 
            lastMove = null;
            moveHistory = [];
            renderStones();
            updateTurnUI();
            updateStonesCount();
            clearAssistHighlights();
            cancelPendingMove();
            if (assistModeActive) calculateBestMove();
        }

        function handleIntersectionClick(r, c) {
            if (myRole !== null && currentTurn !== myRole) return;
            if (pendingMoveContext || boardState[r][c] !== null) return;

            // Rule matrix validation: Suicide check
            const validation = simulatePlacementAndCheckCaptured(r, c, currentTurn);
            
            if (validation.isSuicide) {
                // Risk interruption deployment
                triggerRiskInterruption(r, c);
            } else {
                commitPlacement(r, c);
            }
        }

        function triggerRiskInterruption(r, c) {
            pendingMoveContext = { r, c };
            document.getElementById('dangerBanner').classList.add('active');
        }

        function cancelPendingMove() {
            pendingMoveContext = null;
            document.getElementById('dangerBanner').classList.remove('active');
        }

        // Action confirmation bound to risk trigger execution
        document.getElementById('dangerConfirmBtn').onclick = () => {
            if (pendingMoveContext) {
                const { r, c } = pendingMoveContext;
                cancelPendingMove();
                commitPlacement(r, c);
            }
        };

        function commitPlacement(r, c) {
            if (myRole !== null) {
                sendMqttMessage('move', { r, c });
            }
            executeMoveSync(r, c);
        }

        // BFS Core Rule Algorithm: Evaluate liberties (气) for specific group
        function getGroupInfo(startR, startC, targetBoard) {
            const color = targetBoard[startR][startC];
            if (!color) return { stones: [], liberties: 0 };

            const visited = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(false));
            const stones = [];
            const libertiesSet = new Set();
            const queue = [{r: startR, c: startC}];
            
            visited[startR][startC] = true;

            const dir = [{r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1}];

            while(queue.length > 0) {
                const curr = queue.shift();
                stones.push(curr);

                for(let i=0; i<4; i++) {
                    const nr = curr.r + dir[i].r;
                    const nc = curr.c + dir[i].c;

                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        if (!targetBoard[nr][nc]) {
                            libertiesSet.add(`${nr},${nc}`);
                        } else if (targetBoard[nr][nc] === color && !visited[nr][nc]) {
                            visited[nr][nc] = true;
                            queue.push({r: nr, c: nc});
                        }
                    }
                }
            }
            return { stones, liberties: libertiesSet.size };
        }

        // Rule Matrix Check: Simulation mapping for captures and suicide conditions
        function simulatePlacementAndCheckCaptured(r, c, color) {
            const simBoard = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            for(let i=0; i<BOARD_SIZE; i++) {
                for(let j=0; j<BOARD_SIZE; j++) simBoard[i][j] = boardState[i][j];
            }

            simBoard[r][c] = color;
            const enemyColor = color === 'black' ? 'white' : 'black';
            const capturedStones = [];

            const dir = [{r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1}];
            for(let i=0; i<4; i++) {
                const nr = r + dir[i].r;
                const nc = c + dir[i].c;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                    if (simBoard[nr][nc] === enemyColor) {
                        const group = getGroupInfo(nr, nc, simBoard);
                        if (group.liberties === 0) {
                            group.stones.forEach(s => {
                                if (!capturedStones.some(exist => exist.r === s.r && exist.c === s.c)) {
                                    capturedStones.push(s);
                                }
                            });
                        }
                    }
                }
            }

            capturedStones.forEach(s => simBoard[s.r][s.c] = null);

            const selfGroup = getGroupInfo(r, c, simBoard);
            const isSuicide = (selfGroup.liberties === 0);

            return { isSuicide, capturedStones };
        }

        function executeMoveSync(r, c) {
            const validation = simulatePlacementAndCheckCaptured(r, c, currentTurn);
            
            moveHistory.push({ board: JSON.parse(JSON.stringify(boardState)), turn: currentTurn, lastMove: lastMove ? { ...lastMove } : null });
            
            boardState[r][c] = currentTurn;
            
            validation.capturedStones.forEach(s => {
                boardState[s.r][s.c] = null;
            });

            lastMove = { r, c };
            
            renderStones();
            updateStonesCount();
            playStoneSound();

            currentTurn = currentTurn === 'black' ? 'white' : 'black';
            updateTurnUI();

            if (assistModeActive) setTimeout(calculateBestMove, 100);
        }

        function renderStones() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                    const oldStone = hitBox.querySelector('.stone');
                    if (oldStone) oldStone.remove();

                    hitBox.classList.remove('last-move', 'has-stone');

                    if (lastMove && lastMove.r === r && lastMove.c === c) {
                        hitBox.classList.add('last-move');
                    }

                    const val = boardState[r][c];
                    if (val) {
                        hitBox.classList.add('has-stone');
                        const stoneDOM = document.createElement('div');
                        stoneDOM.className = `stone ${val}`;
                        hitBox.appendChild(stoneDOM);
                    }
                }
            }
        }

        function updateStonesCount() {
            let bCount = 0, wCount = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (boardState[r][c] === 'black') bCount++;
                    if (boardState[r][c] === 'white') wCount++;
                }
            }
            
            if (!assistModeActive) {
                document.getElementById('blackEvalText').innerText = `${bCount} Black`;
                document.getElementById('whiteEvalText').innerText = `${wCount} White`;
                
                const total = bCount + wCount;
                if (total === 0) {
                    document.getElementById('blackEvalBar').style.width = '50%';
                    document.getElementById('whiteEvalBar').style.width = '50%';
                } else {
                    const bPercent = (bCount / total) * 100;
                    document.getElementById('blackEvalBar').style.width = `${bPercent}%`;
                    document.getElementById('whiteEvalBar').style.width = `${100 - bPercent}%`;
                }
            }
        }

        function playStoneSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.06);
            } catch (e) {}
        }

        function toggleAssistMode(force) {
            assistModeActive = force !== undefined ? force : !assistModeActive;
            document.getElementById('assistToggle').checked = assistModeActive;
            log(`[AI 辅助] 外部KataGo引擎推荐服务已${assistModeActive?'激活':'关闭'}。`);
            if(assistModeActive && currentTurn && (!myRole || myRole === currentTurn)) calculateBestMove();
            else {
                clearAssistHighlights();
                updateStonesCount();
            }
        }

        function clearAssistHighlights() {
            document.querySelectorAll('.intersection').forEach(el => el.classList.remove('assist-suggest'));
        }

        // ========================================================
        // 核心改动：调用 3000 端口本地后端，获取 KataGo 引擎真实算力数据
        // ========================================================
        function calculateBestMove() {
            if (!currentTurn) return;
            clearAssistHighlights();

            let fullMoves = getFullGtpMovesHistory();
            
            if (lastMove) {
                const lastGtp = coordsToGtp(lastMove.r, lastMove.c);
                if (fullMoves.length === 0 || fullMoves[fullMoves.length - 1] !== lastGtp) {
                    fullMoves.push(lastGtp);
                }
            }

            fetch('http://localhost:3000/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    moves: fullMoves,
                    nextColor: currentTurn // 'black' 或 'white'
                })
            })
            .then(res => res.json())
            .then(data => {
                let isMyTurn = (myRole === null) || (myRole === currentTurn);
                
                if (isMyTurn && data.bestMove && data.bestMove !== '(none)' && data.bestMove !== 'pass') {
                    const coords = gtpToCoords(data.bestMove);
                    if (coords) {
                        const cell = document.querySelector(`[data-row='${coords.r}'][data-col='${coords.c}']`);
                        if (cell) {
                            cell.classList.add('assist-suggest'); 
                        }
                    }
                }

                if (data.score !== undefined) {
                    let blackWinRate = data.score; 
                    let whiteWinRate = 100 - blackWinRate;

                    document.getElementById('blackEvalBar').style.width = `${blackWinRate}%`;
                    document.getElementById('whiteEvalBar').style.width = `${whiteWinRate}%`;
                    
                    document.getElementById('blackEvalText').innerText = `${blackWinRate.toFixed(1)}% 黑胜率`;
                    document.getElementById('whiteEvalText').innerText = `${whiteWinRate.toFixed(1)}% 白胜率`;
                }
            })
            .catch(err => {
                console.error("无法联通本地 KataGo 后端服务:", err);
            });
        }

        function sendPass() {
            if (confirm("确定要在本回合停手过牌吗？(双方连续停手通常意味着终局计数)")) {
                sendMqttMessage('pass');
                currentTurn = currentTurn === 'black' ? 'white' : 'black';
                updateTurnUI();
                log("你选择了停手过牌。");
                if (assistModeActive) setTimeout(calculateBestMove, 100);
            }
        }

        function requestUndo() {
            if (moveHistory.length === 0) return alert("没有可以撤销的步骤。");
            if (myRole !== null) {
                if (currentTurn === myRole) return alert("必须在对方回合期间才能申请悔棋！");
                log("向对方发送悔棋申请..."); sendMqttMessage('undo_request');
            } else { executeUndoLocal(); log("本地撤回上一步成功。"); }
        }

        function executeUndoLocal() {
            if (moveHistory.length === 0) return;
            const prev = moveHistory.pop();
            boardState = prev.board; currentTurn = prev.turn; lastMove = prev.lastMove;
            clearSelectionHighlights(); renderStones(); updateTurnUI(); updateStonesCount();
            cancelPendingMove();
            if (assistModeActive) calculateBestMove();
        }

        function clearSelectionHighlights() {
            // Placeholder compatibility interface with previous standard logic parameters
        }

        function updateConnectionUI(isConnected) {
            const badge = document.getElementById('connectionStatus'); 
            const rBadge = document.getElementById('roleStatus');
            if (isConnected) {
                badge.innerText = "网络对战"; badge.className = "status-badge connected";
                rBadge.style.display = "inline-block"; rBadge.innerText = myRole === 'black' ? "黑子(先手)" : "白子(后手)";
            } else {
                badge.innerText = "离线单机"; badge.className = "status-badge local-mode"; rBadge.style.display = "none";
            }
            updateTurnUI();
        }

        function updateTurnUI() {
            const turnBadge = document.getElementById('turnStatus'); 
            if (!currentTurn) return;
            const name = currentTurn === 'black' ? '黑方' : '白方'; 
            turnBadge.innerText = `当前回合: ${name}`;
            if (myRole !== null && currentTurn === myRole) { 
                turnBadge.className = "status-badge your-turn"; 
                turnBadge.innerText += " (轮到你)"; 
            } else { 
                turnBadge.className = "status-badge"; 
            }
        }

        function updateStatsUI() {
            document.getElementById('statWins').innerText = matchStats.wins;
            document.getElementById('statLosses').innerText = matchStats.losses;
            const total = matchStats.wins + matchStats.losses;
            document.getElementById('statRate').innerText = total === 0 ? "0%" : `${Math.round((matchStats.wins / total) * 100)}%`;
        }

        function copyRoomKey() { 
            const id = document.getElementById('myIdDisplay').innerText; 
            if(!id.includes("Generating")) navigator.clipboard.writeText(id).then(() => log("棋室钥匙复制成功！")); 
        }
        
        function log(text) { 
            const logBox = document.getElementById('logBox'); 
            logBox.innerHTML += `<br><span style="color:#666">[${new Date().toLocaleTimeString().split(' ')[0]}]</span> ${text}`; 
            logBox.scrollTop = logBox.scrollHeight; 
        }

        renderSVGBoard(); 
        createDOMGrid(); 
        resetBoardLocal(); 
        initNetwork(); 
        updateStatsUI();
    </script>
</body>
