<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Aeroplane Chess - Masterpiece Pro</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0b0f12;
            --surface: #141a22;
            --surface-sub: #1e2630;
            --border: #2c3746;
            --text-main: #f0f4f8;
            --text-dim: #7e8e9f;
            
            /* 四方阵营发光核心色 */
            --red-color: #ff3355;
            --yellow-color: #ffaa00;
            --blue-color: #0088ff;
            --green-color: #00cc66;
            
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --grid-size: 42px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { display: flex; gap: 30px; max-width: 1300px; width: 100%; align-items: center; justify-content: center; }
        .sidebar { flex: 0 0 360px; width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 14px; }
        
        h1 { font-size: 1.2rem; font-weight: 300; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: center; }
        .label-tiny { font-size: 10px; font-weight: 600; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; }
        .panel-section { background: #090d11; border: 1px solid var(--border); border-radius: 8px; padding: 14px; position: relative; }
        
        /* 骰子中央舱 */
        .dice-container { display: flex; align-items: center; gap: 15px; margin-top: 5px; }
        .dice-cube { width: 50px; height: 50px; background: var(--surface-sub); border: 2px solid var(--border); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: bold; color: #fff; cursor: pointer; transition: transform 0.15s linear, border-color 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .dice-cube.rolling { transform: rotate(360deg) scale(0.9); border-color: var(--blue-color); }
        
        .peer-id-display { font-family: monospace; font-size: 0.95rem; color: #fff; font-weight: bold; background: var(--surface-sub); padding: 10px; border-radius: 6px; border: 1px solid var(--border); text-align: center; word-break: break-all; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: var(--surface-sub); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 0.85rem; outline: none; }
        input[type="text"]:focus { border-color: #55667a; }

        .btn { background: var(--text-main); color: var(--bg); border: none; padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn:hover { background: #e5e5e5; transform: translateY(-1px); }
        .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
        .btn-secondary:hover { color: #fff; border-color: #888; background: rgba(255,255,255,0.02); }

        .status-area { display: flex; flex-wrap: wrap; gap: 6px; }
        .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #222; color: var(--text-dim); }
        .status-badge.connected { background: #1b4332; color: #52b788; }
        .status-badge.local-mode { background: #1a233a; color: #70a1ff; }
        
        .status-badge.turn-red { background: rgba(255,51,85,0.2); color: var(--red-color); }
        .status-badge.turn-yellow { background: rgba(255,170,0,0.2); color: var(--yellow-color); }
        .status-badge.turn-blue { background: rgba(0,136,ff,0.2); color: var(--blue-color); }
        .status-badge.turn-green { background: rgba(0,204,102,0.2); color: var(--green-color); }

        .log-box { max-height: 140px; hieght: 140px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: var(--text-dim); line-height: 1.6; margin-top: 6px; border-top: 1px solid #1a222d; padding-top: 6px; }
        .log-box::-webkit-scrollbar { width: 4px; }
        .log-box::-webkit-scrollbar-thumb { background: #334455; border-radius: 2px; }

        /* 核心矩阵主盘（15*15布局） */
        .board-wrapper {
            position: relative;
            background: #11161d; 
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 3px solid #202b3a;
        }
        .ludo-board {
            display: grid;
            grid-template-columns: repeat(15, var(--grid-size));
            grid-template-rows: repeat(15, var(--grid-size));
            background: #151c24;
            gap: 1px;
            position: relative;
        }

        /* 矩阵单元网格配置 */
        .cell {
            position: relative;
            background: #19222c;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* 四方主机场基地色彩映射 */
        .cell.base-r { background: rgba(255,51,85,0.08); border: 1px dashed rgba(255,51,85,0.3); }
        .cell.base-y { background: rgba(255,170,0,0.08); border: 1px dashed rgba(255,170,0,0.3); }
        .cell.base-b { background: rgba(0,136,255,0.08); border: 1px dashed rgba(0,136,255,0.3); }
        .cell.base-g { background: rgba(0,204,102,0.08); border: 1px dashed rgba(0,204,102,0.3); }

        /* 赛道普通方块与终点终极光束 */
        .cell.bg-red { background: rgba(255,51,85,0.25); box-shadow: inset 0 0 8px rgba(255,51,85,0.2); }
        .cell.bg-yellow { background: rgba(255,170,0,0.25); box-shadow: inset 0 0 8px rgba(255,170,0,0.2); }
        .cell.bg-blue { background: rgba(0,136,255,0.25); box-shadow: inset 0 0 8px rgba(0,136,255,0.2); }
        .cell.bg-green { background: rgba(0,204,102,0.25); box-shadow: inset 0 0 8px rgba(0,204,102,0.2); }
        .cell.center-crown { background: #243042 !important; border: 2px solid #3d516d; font-size: 1.2rem; }

        /* 实体飞机棋子 */
        .piece {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(0,0,0,0.2);
            transition: all 0.4s var(--ease); z-index: 10; position: absolute;
        }
        .piece:hover { transform: scale(1.15) translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .piece.clickable { animation: piecePulse 1.2s infinite; border: 2px solid #fff !important; }

        .piece.red { background: linear-gradient(135deg, #ff6688, #ff3355); border: 1px solid #ff003c; color: #fff; }
        .piece.yellow { background: linear-gradient(135deg, #ffcc33, #ffaa00); border: 1px solid #cc8800; color: #111; }
        .piece.blue { background: linear-gradient(135deg, #33a2ff, #0088ff); border: 1px solid #0066cc; color: #fff; }
        .piece.green { background: linear-gradient(135deg, #33ff99, #00cc66); border: 1px solid #00994d; color: #fff; }

        /* 重叠多枚棋子堆叠微调 */
        .piece.stack-0 { transform: translate(0, 0); }
        .piece.stack-1 { transform: translate(4px, -4px); }
        .piece.stack-2 { transform: translate(8px, -8px); }
        .piece.stack-3 { transform: translate(12px, -12px); }

        @keyframes piecePulse {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.6); }
            100% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
        }

        /* 全局庆典弹窗结构 */
        .celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 15, 18, 0.9); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s var(--ease);
        }
        .celebration-overlay.active { opacity: 1; pointer-events: auto; }
        .celebration-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 40px 60px; text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8); transform: scale(0.9); transition: transform 0.4s var(--ease);
        }
        .celebration-overlay.active .celebration-card { transform: scale(1); }
        .celebration-title { font-size: 2.8rem; font-weight: 200; letter-spacing: 0.1em; margin-bottom: 12px; color: #fff; }

        @media (max-width: 950px) {
            .container { flex-direction: column-reverse; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="celebrationOverlay" class="celebration-overlay">
        <div class="celebration-card">
            <div id="celebrationTitle" class="celebration-title">VICTORY</div>
            <p id="celebrationSubtitle" style="color: var(--text-dim); margin-bottom: 24px;"></p>
            <button class="btn" onclick="resetGameLocal(true)">重开一局</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h1>
                Ludo Studio Pro
                <span style="font-size: 10px; font-weight:bold; color: var(--blue-color);">DISTRIBUTED</span>
            </h1>
            
            <div class="panel-section">
                <span class="label-tiny">Control Center</span>
                <div class="dice-container">
                    <div id="dice" class="dice-cube" onclick="rollDiceAction()">⚀</div>
                    <div>
                        <div id="actionTip" style="font-size: 0.9rem; font-weight:bold;">请掷骰子</div>
                        <div id="subTip" style="font-size: 0.75rem; color: var(--text-dim); margin-top:2px;">等待本回合行动</div>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Your Room Key</span>
                <div class="peer-id-display" id="myIdDisplay">Generating...</div>
                <button class="btn btn-secondary" style="margin-top: 8px; width: 100%;" onclick="copyRoomKey()">Copy Key</button>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Join Room</span>
                <div class="input-group">
                    <input type="text" id="peerIdInput" placeholder="Paste peer key...">
                    <button class="btn" style="padding: 10px 14px;" onclick="connectToRoom()">加入对局</button>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Live State Monitor</span>
                <div class="status-area" style="margin-top:4px;">
                    <div id="connectionStatus" class="status-badge local-mode">Local Mode</div>
                    <div id="turnStatus" class="status-badge turn-red">Turn: RED</div>
                    <div id="roleStatus" class="status-badge" style="display:none;"></div>
                </div>
                <div class="log-box" id="logBox">Aeroplane Map grid initialization standard 15x15 complete.</div>
            </div>
            
            <button class="btn btn-secondary" style="width: 100%; border-color: #cc3344; color:#cc3344;" onclick="resetGameLocal(true)">重置本地战局</button>
        </div>

        <div class="board-wrapper">
            <div class="ludo-board" id="boardCanvas"></div>
        </div>
    </div>

    <script>
        /**
         * 经典飞行棋地图数据字典与时空总线模型
         * 15x15标准棋盘格：外环52格通用格子，内轨各方独立6格跑道，大飞跃跃迁规则对齐。
         */
        const MAP_SIZE = 15;
        let turn = 'red'; // 顺时针流转次序: red -> yellow -> blue -> green
        let diceValue = 0;
        let hasRolled = false;
        let myRole = null; // 默认单机本地多端模式，加入房间后自动分配单席
        
        let mqttClient = null;
        let currentRoomTopic = '';
        const myUniqueId = 'LUDO_UID_' + Math.random().toString(36).substr(2, 9);
        let myRoomId = '';

        // 四方阵营固定参数表
        const colors = ['red', 'yellow', 'blue', 'green'];
        const colorNames = { red: '红方', yellow: '黄方', blue: '蓝方', green: '绿方' };
        
        // 起飞跑道起始总线格索引
        const startTrackIndex = { red: 0, yellow: 13, blue: 26, green: 39 };
        // 进入内轨分支汇入点格索引
        const endTrackIndex = { red: 50, yellow: 11, blue: 24, green: 37 };

        // 实体棋子状态矩阵(每个阵营4架战机)
        // state: 'hangar'(停机坪), 'track'(大环线), 'runway'(内轨跑道), 'done'(抵达终点)
        // stepCount: 记录脱离停机坪后累计行进的格数，用于判定切入内轨及终点回弹
        let pieces = {
            red:    [{id:0, state:'hangar', stepCount:-1}, {id:1, state:'hangar', stepCount:-1}, {id:2, state:'hangar', stepCount:-1}, {id:3, state:'hangar', stepCount:-1}],
            yellow: [{id:0, state:'hangar', stepCount:-1}, {id:1, state:'hangar', stepCount:-1}, {id:2, state:'hangar', stepCount:-1}, {id:3, state:'hangar', stepCount:-1}],
            blue:   [{id:0, state:'hangar', stepCount:-1}, {id:1, state:'hangar', stepCount:-1}, {id:2, state:'hangar', stepCount:-1}, {id:3, state:'hangar', stepCount:-1}],
            green:  [{id:0, state:'hangar', stepCount:-1}, {id:1, state:'hangar', stepCount:-1}, {id:2, state:'hangar', stepCount:-1}, {id:3, state:'hangar', stepCount:-1}]
        };

        // 52格外部通用主环线绝对坐标网格点射映射 (15x15外郭大框逆时针/顺时针经典回路)
        const commonTrackCoords = [
            {r:6,c:1}, {r:6,c:2}, {r:6,c:3}, {r:6,c:4}, {r:6,c:5}, // 红方出击段
            {r:5,c:6}, {r:4,c:6}, {r:3,c:6}, {r:2,c:6}, {r:1,c:6}, {r:0,c:6},
            {r:0,c:7}, {r:0,c:8}, // 顶端交接
            {r:1,c:8}, {r:2,c:8}, {r:3,c:8}, {r:4,c:8}, {r:5,c:8},
            {r:6,c:9}, {r:6,c:10}, {r:6,c:11}, {r:6,c:12}, {r:6,c:13}, {r:6,c:14}, // 黄方段
            {r:7,c:14}, {r:8,c:14}, // 右侧交接
            {r:8,c:13}, {r:8,c:12}, {r:8,c:11}, {r:8,c:10}, {r:8,c:9},
            {r:9,c:8}, {r:10,c:8}, {r:11,c:8}, {r:12,c:8}, {r:13,c:8}, {r:14,c:8}, // 蓝方段
            {r:14,c:7}, {r:14,c:6}, // 底端交接
            {r:13,c:6}, {r:12,c:6}, {r:11,c:6}, {r:10,c:6}, {r:9,c:6},
            {r:8,c:5}, {r:8,c:4}, {r:8,c:3}, {r:8,c:2}, {r:8,c:1}, {r:8,c:0}, // 绿方段
            {r:7,c:0}, {r:6,c:0} // 左侧回环
        ];

        // 4方停机坪固定专属网格物理坐标
        const hangarCoords = {
            red:    [{r:2,c:2}, {r:2,c:3}, {r:3,c:2}, {r:3,c:3}],
            yellow: [{r:2,c:11}, {r:2,c:12}, {r:3,c:11}, {r:3,c:12}],
            blue:   [{r:11,c:11}, {r:11,c:12}, {r:12,c:11}, {r:12,c:12}],
            green:  [{r:11,c:2}, {r:11,c:3}, {r:12,c:2}, {r:12,c:3}]
        };

        // 内轨专属跑道绝对网格坐标 (每队6格，最后一格为轴心终点)
        const runwayCoords = {
            red:    [{r:7,c:1}, {r:7,c:2}, {r:7,c:3}, {r:7,c:4}, {r:7,c:5}, {r:7,c:6}],
            yellow: [{r:1,c:7}, {r:2,c:7}, {r:3,c:7}, {r:4,c:7}, {r:5,c:7}, {r:6,c:7}],
            blue:   [{r:13,c:13}, {r:7,c:12}, {r:7,c:11}, {r:7,c:10}, {r:7,c:9}, {r:7,c:8}], // 注：统一归心
            green:  [{r:13,c:7}, {r:12,c:7}, {r:11,c:7}, {r:10,c:7}, {r:9,c:7}, {r:8,c:7}]
        };
        // 修正蓝方内道物理坐标映射，使其精准对齐中央三角
        runwayCoords.blue = [{r:7,c:13}, {r:7,c:12}, {r:7,c:11}, {r:7,c:10}, {r:7,c:9}, {r:7,c:8}];

        // 颜色网格类型计算生成器 (用于渲染棋盘经典格子分布)
        function getCellColorClass(r, c) {
            if (r >= 0 && r <= 5 && c >= 0 && c <= 5) return 'base-r';
            if (r >= 0 && r <= 5 && c >= 9 && c <= 14) return 'base-y';
            if (r >= 9 && r <= 14 && c >= 9 && c <= 14) return 'base-b';
            if (r >= 9 && r <= 14 && c >= 0 && c <= 5) return 'base-g';
            if (r === 7 && c === 7) return 'center-crown';
            
            // 匹配大环线颜色交替序列
            let idx = commonTrackCoords.findIndex(coord => coord.r === r && coord.c === c);
            if (idx !== -1) {
                let m = idx % 4;
                if (m === 0) return 'bg-red';
                if (m === 1) return 'bg-yellow';
                if (m === 2) return 'bg-blue';
                return 'bg-green';
            }

            // 匹配内直道色彩
            if (r === 7 && c >= 1 && c <= 6) return 'bg-red';
            if (c === 7 && r >= 1 && r <= 6) return 'bg-yellow';
            if (r === 7 && c >= 8 && c <= 13) return 'bg-blue';
            if (c === 7 && r >= 8 && r <= 13) return 'bg-green';

            return '';
        }

        /**
         * 构建HTML棋盘DOM骨架
         */
        function createBoardDOM() {
            const canvas = document.getElementById('boardCanvas');
            canvas.innerHTML = '';
            for (let r = 0; r < MAP_SIZE; r++) {
                for (let c = 0; c < MAP_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${getCellColorClass(r, c)}`;
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    
                    // 特殊轴心绘制
                    if (r === 7 && c === 7) cell.innerText = '👑';
                    canvas.appendChild(cell);
                }
            }
        }

        /**
         * 全量渲染更新所有棋子的物理层空间坐标
         */
        function renderPieces() {
            // 清理上一轮残存的棋子DOM节点
            document.querySelectorAll('.piece').forEach(p => p.remove());

            // 物理位置单元格哈希桶，用于解决棋子重叠堆叠显示效果
            let cellBuckets = {};

            colors.forEach(color => {
                pieces[color].forEach(piece => {
                    if (piece.state === 'done') return; // 已抵达终点安全离场

                    let coord = { r: 0, c: 0 };
                    if (piece.state === 'hangar') {
                        coord = hangarCoords[color][piece.id];
                    } else if (piece.state === 'track') {
                        coord = commonTrackCoords[piece.trackIndex];
                    } else if (piece.state === 'runway') {
                        coord = runwayCoords[color][piece.stepCount - 50];
                    }

                    let key = `${coord.r}_${coord.c}`;
                    if (!cellBuckets[key]) cellBuckets[key] = [];
                    cellBuckets[key].push({ color, piece });
                });
            });

            // 真正往网格里装载带偏移动画的DOM
            Object.keys(cellBuckets).forEach(key => {
                let [r, c] = key.split('_').map(Number);
                let list = cellBuckets[key];
                
                list.forEach((item, index) => {
                    const cellDOM = document.querySelector(`[data-r='${r}'][data-c='${c}']`);
                    if (!cellDOM) return;

                    const pDOM = document.createElement('div');
                    pDOM.className = `piece ${item.color} stack-${Math.min(index, 3)}`;
                    pDOM.innerText = (item.color === 'red' ? '✈' : item.color === 'yellow' ? '✈' : item.color === 'blue' ? '✈' : '✈');
                    
                    // 绑定特定战术高亮高亮逻辑
                    let isMyTurn = (myRole === null || myRole === turn);
                    if (isMyTurn && item.color === turn && hasRolled && isPieceMovable(item.piece)) {
                        pDOM.classList.add('clickable');
                        pDOM.onclick = () => movePieceAction(item.piece.id);
                    }

                    // 动态定位
                    pDOM.style.left = `${cellDOM.offsetLeft + index*3}px`;
                    pDOM.style.top = `${cellDOM.offsetTop - index*3}px`;
                    document.getElementById('boardCanvas').appendChild(pDOM);
                });
            });
        }

        /**
         * 判定单个棋子当前数值下是否拥有行进权限
         */
        function isPieceMovable(piece) {
            if (piece.state === 'done') return false;
            if (piece.state === 'hangar') {
                return (diceValue === 5 || diceValue === 6); // 经典5点、6点即可起飞开拔
            }
            return true;
        }

        /**
         * 判断本方阵营是否还存活任意可移动棋子
         */
        function hasAnyLegalMoves() {
            return pieces[turn].some(p => isPieceMovable(p));
        }

        /**
         * 模拟掷骰子动作主逻辑
         */
        function rollDiceAction() {
            if (myRole !== null && turn !== myRole) return; // 联机时非己方回合阻断
            if (hasRolled) return;

            const diceDOM = document.getElementById('dice');
            diceDOM.classList.add('rolling');
            
            // 滚动物理动态质感模仿
            let t = setInterval(() => {
                diceDOM.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];
            }, 60);

            setTimeout(() => {
                clearInterval(t);
                diceDOM.classList.remove('rolling');
                
                diceValue = Math.floor(Math.random() * 6) + 1;
                const diceFaces = ['','⚀','⚁','⚂','⚃','⚄','⚅'];
                diceDOM.innerText = diceFaces[diceValue];
                hasRolled = true;

                log(`【${colorNames[turn]}】掷出了 <span style="color:#fff; font-weight:bold;">${diceValue}</span> 点`);

                if (myRole !== null) {
                    sendMqttMessage('roll', { value: diceValue });
                }

                evaluateTurnPhase();
            }, 600);
        }

        /**
         * 骰子停稳后状态机判定
         */
        function evaluateTurnPhase() {
            if (!hasAnyLegalMoves()) {
                log(`无合规战机可起飞或滑行，${diceValue === 6 ? '保留回合':'置换球权'}`);
                setTimeout(() => {
                    // 飞行棋经典规则：投出6点可额外获得一次掷骰特权
                    if (diceValue === 6) {
                        nextTurnReset(turn);
                    } else {
                        passTurn();
                    }
                }, 1000);
            } else {
                document.getElementById('actionTip').innerText = "请选择战机";
                document.getElementById('subTip').innerText = `点击带呼吸灯的 ${colorNames[turn]} 飞机行进`;
                renderPieces();
            }
        }

        /**
         * 执行核心走子逻辑与大环线特权顺跳击落检测
         */
        function movePieceAction(pieceId) {
            if (myRole !== null && turn !== myRole) return;
            if (!hasRolled) return;

            if (myRole !== null) {
                sendMqttMessage('move', { pieceId: pieceId });
            }

            executeMoveSync(turn, pieceId, diceValue);
        }

        function executeMoveSync(actorColor, pieceId, rollVal) {
            let p = pieces[actorColor][pieceId];
            log(`战机 [${pieceId+1}号] 引擎启动，向前推进 ${rollVal} 格`);

            if (p.state === 'hangar') {
                // 出库起飞
                p.state = 'track';
                p.trackIndex = startTrackIndex[actorColor];
                p.stepCount = 0;
            } else if (p.state === 'track') {
                p.stepCount += rollVal;
                if (p.stepCount >= 50) {
                    // 切入归心内道
                    p.state = 'runway';
                    p.trackIndex = -1;
                } else {
                    p.trackIndex = (p.trackIndex + rollVal) % 52;
                    
                    // 顺跳规则：若降落格色彩与飞机自身本色一致，则向前暴跳4格
                    let landedCellColor = getCellColorClass(commonTrackCoords[p.trackIndex].r, commonTrackCoords[p.trackIndex].c);
                    if (landedCellColor === `bg-${actorColor}`) {
                        p.trackIndex = (p.trackIndex + 4) % 52;
                        p.stepCount += 4;
                        log(`⚡ 触发【同色顺跳】特权，战机向前跃迁 4 格`);
                        
                        // 经典大跨海跃迁快捷路径：每个阵营在对角都有一个超级跳跃格 (格点索引相差12步左右)
                        // 为简化实现，检测特定顺跳后的落点坐标是否为四方定锚的超级跃迁点
                        if ((actorColor === 'red' && p.trackIndex === 16) ||
                            (actorColor === 'yellow' && p.trackIndex === 29) ||
                            (actorColor === 'blue' && p.trackIndex === 42) ||
                            (actorColor === 'green' && p.trackIndex === 3)) {
                            p.trackIndex = (p.trackIndex + 12) % 52;
                            p.stepCount += 12;
                            log(`🚀 触发【跨海大飞跃】！凌空切断战场，摧毁航线敌机`);
                        }
                    }
                }
            } else if (p.state === 'runway') {
                p.stepCount += rollVal;
                if (p.stepCount === 55) {
                    // 正好登顶
                    p.state = 'done';
                    log(`🎉 恭喜！一架 【${colorNames[actorColor]}】战机成功入舱凯旋！`);
                } else if (p.stepCount > 55) {
                    // 精准超越，多余步数反弹回滚
                    let overflow = p.stepCount - 55;
                    p.stepCount = 55 - overflow;
                    log(`↩ 冲刺过载！战机在终点反弹，回退 ${overflow} 格`);
                }
            }

            // 火网交织：击落追尾判定 (降落在公用航线时，若存在敌机，全部踹回停机坪)
            if (p.state === 'track') {
                let currentCoord = commonTrackCoords[p.trackIndex];
                colors.forEach(enemyColor => {
                    if (enemyColor === actorColor) return;
                    pieces[enemyColor].forEach(enemyPiece => {
                        if (enemyPiece.state === 'track') {
                            let enemyCoord = commonTrackCoords[enemyPiece.trackIndex];
                            if (enemyCoord.r === currentCoord.r && enemyCoord.c === currentCoord.c) {
                                // 发生惨烈空战，将其彻底击落
                                enemyPiece.state = 'hangar';
                                enemyPiece.stepCount = -1;
                                enemyPiece.trackIndex = -1;
                                log(`💥 【空战拦截】${colorNames[actorColor]} 撞击了 ${colorNames[enemyColor]} 的 [${enemyPiece.id+1}号机]，将其无情击落回停机坪！`);
                            }
                        }
                    });
                });
            }

            // 检查大局胜负条件
            if (checkVictory(actorColor)) {
                triggerGameOver(actorColor);
                return;
            }

            // 回合平滑交接
            setTimeout(() => {
                if (rollVal === 6) {
                    log(`掷出6点获得【再来一次】奖励特权`);
                    nextTurnReset(actorColor);
                } else {
                    passTurn();
                }
            }, 600);
        }

        /**
         * 判定某一色系阵营是否四机全部安全到港
         */
        function checkVictory(color) {
            return pieces[color].every(p => p.state === 'done');
        }

        function triggerGameOver(winnerColor) {
            const overlay = document.getElementById('celebrationOverlay');
            document.getElementById('celebrationSubtitle').innerText = `【${colorNames[winnerColor]}】四架战机通盘安全登顶，智算全局，终获大捷！`;
            overlay.classList.add('active');
            
            // 喷射漫天礼花
            let end = Date.now() + (3 * 1000);
            (function frame() {
                confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        /**
         * 交还或下发本轮控制权到下一方
         */
        function passTurn() {
            let currIdx = colors.indexOf(turn);
            let nextIdx = (currIdx + 1) % 4;
            nextTurnReset(colors[nextIdx]);
        }

        function nextTurnReset(nextColor) {
            turn = nextColor;
            hasRolled = false;
            diceValue = 0;
            
            const tStatus = document.getElementById('turnStatus');
            tStatus.className = `status-badge turn-${turn}`;
            tStatus.innerText = `Turn: ${turn.toUpperCase()}`;

            let isMe = (myRole === null || turn === myRole);
            if (myRole !== null) {
                tStatus.innerText += isMe ? " (轮到你)" : " (等待对方)";
            }

            document.getElementById('dice').innerText = '⚀';
            document.getElementById('actionTip').innerText = isMe ? "请掷骰子" : "对方正在思索";
            document.getElementById('subTip').innerText = isMe ? "点击方块掷点" : "时空量子中转中...";

            renderPieces();
        }

        function resetGameLocal(notifyRemote = false) {
            document.getElementById('celebrationOverlay').classList.remove('active');
            turn = 'red';
            hasRolled = false;
            diceValue = 0;
            
            colors.forEach(c => {
                pieces[c].forEach(p => {
                    p.state = 'hangar';
                    p.stepCount = -1;
                    p.trackIndex = -1;
                });
            });

            if (notifyRemote && myRole !== null) {
                sendMqttMessage('reset');
            }

            log("🔄 战场时空态势全面逆转，重置初始停机坪排布。");
            nextTurnReset('red');
        }

        // ==================== P2P 分布式联机总线架构 ====================

        function initNetwork() {
            myRoomId = 'ROOM-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('myIdDisplay').innerText = myRoomId;
            currentRoomTopic = `ludo/room/${myRoomId}`;

            log("正在接通全球边缘节点多路分布式总线集群...");
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                log("已成功桥接实时分布式节点。本地专属空域房间开辟就绪。");
                mqttClient.subscribe(currentRoomTopic);
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.senderId === myUniqueId) return; // 拦截自发环路数据
                    handleNetworkData(data);
                } catch (e) {
                    console.error("总线分流异常 matrix failure:", e);
                }
            });
        }

        function connectToRoom() {
            const remoteId = document.getElementById('peerIdInput').value.trim();
            if (!remoteId) return alert("请输入有效的跨端棋室密钥！");
            if (remoteId === myRoomId) return alert("不可加入自建的时空腔！");

            log(`正在解离本地信道，全力跃迁至远端数据轴: ${remoteId}...`);
            
            mqttClient.unsubscribe(currentRoomTopic);
            currentRoomTopic = `ludo/room/${remoteId}`;
            mqttClient.subscribe(currentRoomTopic);

            // 请求切入对局席位
            sendMqttMessage('join_request');
        }

        function sendMqttMessage(type, payload = {}) {
            if (!mqttClient || !currentRoomTopic) return;
            const msg = { type, senderId: myUniqueId, ...payload };
            mqttClient.publish(currentRoomTopic, JSON.stringify(msg));
        }

        /**
         * 多路联机信令网络状态机
         */
        function handleNetworkData(data) {
            switch(data.type) {
                case 'join_request':
                    if (myRole === null) {
                        // 房东本地升级为红方，分发给远端来客黄方/蓝方座位
                        myRole = 'red';
                        log("🤝 远端对家通过量子密钥破壁切入！您已被锚定为【红方先手】。");
                        updateConnectionUI(true);
                        sendMqttMessage('assign_role', { assignedRole: 'yellow', currentPieces: pieces });
                        nextTurnReset('red');
                    }
                    break;
                case 'assign_role':
                    if (myRole === null) {
                        myRole = data.assignedRole;
                        pieces = data.currentPieces;
                        log(`✅ 双向握手成功！您已被云端中枢矩阵重组分配为【${colorNames[myRole]}】`);
                        updateConnectionUI(true);
                        resetGameLocal(false);
                    }
                    break;
                case 'roll':
                    diceValue = data.value;
                    const diceFaces = ['','⚀','⚁','⚂','⚃','⚄','⚅'];
                    document.getElementById('dice').innerText = diceFaces[diceValue];
                    hasRolled = true;
                    log(`【${colorNames[turn]}】远程掷出 ${diceValue} 点`);
                    evaluateTurnPhase();
                    break;
                case 'move':
                    executeMoveSync(turn, data.pieceId, diceValue);
                    break;
                case 'reset':
                    log("⚠️ 对方发起了强制时空坍缩，战局已全员重置归仓。");
                    resetGameLocal(false);
                    break;
            }
        }

        function updateConnectionUI(isConnected) {
            const badge = document.getElementById('connectionStatus'); 
            const rBadge = document.getElementById('roleStatus');

            if (isConnected) {
                badge.innerText = "网络联机模式"; 
                badge.className = "status-badge connected";
                rBadge.style.display = "inline-block"; 
                rBadge.innerText = `当前执照: ${colorNames[myRole]}`;
            } else {
                badge.innerText = "离线单机模式"; 
                badge.className = "status-badge local-mode"; 
                rBadge.style.display = "none";
            }
        }

        function copyRoomKey() { 
            const id = document.getElementById('myIdDisplay').innerText; 
            if(!id.includes("Generating")) {
                navigator.clipboard.writeText(id).then(() => log("🔗 战术秘钥复制成功，快发给好友跨端共抗吧！")); 
            }
        }
        
        function log(text) { 
            const logBox = document.getElementById('logBox'); 
            logBox.innerHTML += `<br><span style="color:#445566">[${new Date().toLocaleTimeString().split(' ')[0]}]</span> ${text}`; 
            logBox.scrollTop = logBox.scrollHeight; 
        }

        // ==================== 引擎冷启动初始化 ====================
        createBoardDOM();
        renderPieces();
        initNetwork();

    </script>
</body>
