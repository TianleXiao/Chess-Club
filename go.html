<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P GO STUDIO Pro - 移动自适应版</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="mobile.css">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-sub: #27272a;
            --border: #3f3f46;
            --text-main: #f4f4f5;
            --text-dim: #a1a1aa;
            --board-bg: #dcb37b; /* 经典木纹底色 */
            --board-line: #3f2a14;
            --star-point: #3f2a14;
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; flex-direction: row; }

        /* 滚动条隐藏但可滚动 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* ================= 布局系统 ================= */
        .sidebar { width: 320px; background-color: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto; z-index: 10; flex-shrink: 0; }
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 16px; overflow-y: auto; background: radial-gradient(circle at center, #18181b 0%, #09090b 100%); }

        /* ================= 侧边栏 UI ================= */
        .brand { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .brand::before { content: ''; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .panel-section { background-color: var(--surface-sub); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .section-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-group { display: flex; gap: 8px; }
        .modern-input { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: #fff; font-size: 14px; width: 100%; transition: border var(--ease); }
        .modern-input:focus { outline: none; border-color: var(--text-dim); }
        
        .btn { background: #fff; color: #000; border: none; border-radius: 6px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s var(--ease); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .status-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.1); }
        .status-badge.active { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .status-badge.warn { background: rgba(234, 179, 8, 0.15); color: #fde047; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .stat-item { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; }
        .stat-val { font-size: 16px; font-weight: 700; }
        .stat-lbl { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

        /* 操作面板网格 */
        .sidebar-action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .sidebar-action-grid .btn-full { grid-column: span 2; }

        /* 历史落子记录面板 */
        .history-panel { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px; height: 120px; overflow-y: auto; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
        .history-item { display: flex; justify-content: space-between; color: var(--text-dim); padding: 2px 4px; border-radius: 4px; }
        .history-item.active-move { background: rgba(255,255,255,0.05); color: #fff; font-weight: bold; }

        /* AI 开关 */
        .switch-container { display: flex; align-items: center; justify-content: space-between; }
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); border-radius: 24px; transition: 0.3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: #a1a1aa; border-radius: 50%; transition: 0.3s; }
        input:checked + .slider { background-color: #c084fc; }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

        /* ================= 棋盘流式布局 ================= */
        .board-container { width: 100%; max-width: 600px; aspect-ratio: 1 / 1; background-color: var(--board-bg); padding: 3%; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.2); position: relative; display: flex; }
        .board-wrapper { position: relative; width: 100%; height: 100%; }
        
        .svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        .dom-interaction-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .intersection { position: absolute; transform: translate(-50%, -50%); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; border-radius: 50%; }
        @media (hover: hover) { .intersection:hover::before { content: ''; width: 30%; height: 30%; background: rgba(0,0,0,0.3); border-radius: 50%; position: absolute; } }

        /* 棋子缩放 */
        .stone { width: 92%; height: 92%; border-radius: 50%; position: relative; z-index: 6; animation: dropStone 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; box-shadow: 2px 4px 6px rgba(0,0,0,0.4); }
        .stone.black { background: radial-gradient(circle at 30% 30%, #444 0%, #111 60%, #000 100%); }
        .stone.white { background: radial-gradient(circle at 30% 30%, #fff 0%, #e4e4e7 60%, #a1a1aa 100%); }
        
        @keyframes dropStone { 0% { transform: scale(1.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* 最后一手标识 */
        .intersection.last-move .stone::after { content: ''; width: 25%; height: 25%; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; border: 2px solid; }
        .intersection.last-move .stone.black::after { border-color: rgba(255,255,255,0.6); }
        .intersection.last-move .stone.white::after { border-color: rgba(0,0,0,0.5); }

        /* AI 紫圈高亮提示 */
        .intersection.assist-suggest::after { content: ''; width: 100%; height: 100%; border: 3px dashed #c084fc; border-radius: 50%; position: absolute; z-index: 12; animation: assistPulse 1s linear infinite; pointer-events: none; }
        @keyframes assistPulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.4; } 100% { transform: scale(0.9); opacity: 1; } }

        /* ================= 底部状态栏与操作区 ================= */
        .bottom-panel { width: 100%; max-width: 600px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
        
        .evaluator-bar-container { background-color: var(--surface-sub); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .evaluator-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
        .eval-track { height: 8px; background-color: #111; border-radius: 4px; display: flex; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .eval-fill { height: 100%; transition: width 0.4s var(--ease); }
        .eval-fill.black-fill { background-color: #3f3f46; width: 50%; }
        .eval-fill.white-fill { background-color: #f4f4f5; width: 50%; }

        /* 警告横幅 */
        .danger-banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(-150%); background: var(--danger); color: white; padding: 10px 20px; border-radius: 8px; display: flex; gap: 12px; align-items: center; transition: 0.3s var(--ease); z-index: 100; font-size: 13px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        .danger-banner.active { transform: translateX(-50%) translateY(0); }

        /* ================= 移动端适配 ================= */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .sidebar { width: 100%; max-height: none; border-right: none; border-bottom: 1px solid var(--border); padding: 12px; overflow-y: visible; }
            .workspace { padding: 12px; justify-content: flex-start; height: auto; min-height: calc(100vh - 250px); }
            .board-container { padding: 4%; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">P2P GO STUDIO Pro</div>
        
        <div class="panel-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="section-title">我的房间密钥</span>
                <span id="connectionStatus" class="status-badge">单机模式</span>
            </div>
            <div class="input-group">
                <input type="text" id="myIdDisplay" class="modern-input" readonly>
                <button class="btn btn-secondary" onclick="copyRoomKey()">复制</button>
            </div>
            <div class="input-group">
                <input type="text" id="peerIdInput" class="modern-input" placeholder="输入对手密钥联机...">
                <button class="btn" onclick="connectToPeer()">加入</button>
            </div>
        </div>

        <div class="panel-section">
            <span class="section-title">对局控制</span>
            <div class="sidebar-action-grid">
                <button class="btn btn-secondary" onclick="requestUndo()">↺ 悔棋</button>
                <button class="btn btn-secondary" onclick="sendPass()">✋ 停手</button>
                <button class="btn btn-danger" onclick="requestResign()">⚐ 认输</button>
                <button class="btn" style="background: var(--text-dim); color: #000;" onclick="initBoard()">重新开始</button>
                
                <button class="btn btn-secondary" style="border-color: #c084fc; color: #c084fc;" onclick="saveGame()">💾 导出存档</button>
                <button class="btn btn-secondary" style="border-color: #4ade80; color: #4ade80;" onclick="document.getElementById('fileLoadInput').click()">📂 导入存档</button>
                <input type="file" id="fileLoadInput" accept=".go" style="display:none;" onchange="handleFileSelect(event)">
            </div>
        </div>

        <div class="panel-section">
            <span class="section-title">落子部位记录</span>
            <div class="history-panel" id="moveHistoryLog">
                <div style="color: var(--text-dim); text-align: center; margin-top: 40px; font-style: italic;">暂无落子记录</div>
            </div>
        </div>

        <div class="panel-section" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <div>
                <div style="font-size: 13px; font-weight: 600;">KataGo AI 辅助</div>
                <div style="font-size: 11px; color: var(--text-dim);">实时显示推荐落子点</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="assistToggle" onchange="toggleAssistMode(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="panel-section stats-grid">
            <div class="stat-item"><div class="stat-val" id="statWins" style="color:var(--success)">0</div><div class="stat-lbl">胜场</div></div>
            <div class="stat-item"><div class="stat-val" id="statLosses" style="color:var(--danger)">0</div><div class="stat-lbl">负场</div></div>
            <div class="stat-item"><div class="stat-val" id="statRate">0%</div><div class="stat-lbl">胜率</div></div>
        </div>
    </aside>

    <main class="workspace">
        <div class="danger-banner" id="dangerBanner">
            <span>⚠️ 规则拦截：无气禁着点</span>
            <button class="btn btn-secondary" style="padding:4px 8px;" onclick="cancelPendingMove()">取消</button>
            <button class="btn" style="padding:4px 8px; background:#fff; color:#000;" id="dangerConfirmBtn">强行落子</button>
        </div>

        <div class="board-container">
            <div class="board-wrapper" id="boardWrapper">
                <div class="dom-interaction-grid" id="board"></div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="evaluator-bar-container">
                <div class="evaluator-meta">
                    <span style="color: #a1a1aa" id="blackEvalText">黑棋</span>
                    <span id="turnStatus" class="status-badge warn">黑方回合</span>
                    <span style="color: #fff" id="whiteEvalText">白棋</span>
                </div>
                <div class="eval-track">
                    <div class="eval-fill black-fill" id="blackEvalBar"></div>
                    <div class="eval-fill white-fill" id="whiteEvalBar"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const BOARD_SIZE = 19;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let myRole = null; 
        let currentTurn = 'black';
        let lastMove = null;
        let moveHistory = [];
        let assistModeActive = false;
        let pendingMoveContext = null;

        let mqttClient = null;
        let currentRoomTopic = '';
        const myUniqueId = 'UID_' + Math.random().toString(36).substr(2, 9);
        let myRoomId = '';

        let matchStats = JSON.parse(localStorage.getItem('go_p2p_stats')) || { wins: 0, losses: 0 };

        const starPoints = [
            {r: 3, c: 3}, {r: 3, c: 9}, {r: 3, c: 15},
            {r: 9, c: 3}, {r: 9, c: 9}, {r: 9, c: 15},
            {r: 15, c: 3}, {r: 15, c: 9}, {r: 15, c: 15}
        ];

        const GTP_LETTERS = "ABCDEFGHJKLMNOPQRST";
        function coordsToGtp(r, c) { return GTP_LETTERS[c] + (19 - r); }
        function gtpToCoords(gtpStr) {
            if (!gtpStr || gtpStr === '(none)' || gtpStr === 'pass') return null;
            const letter = gtpStr[0].toUpperCase();
            return { r: 19 - parseInt(gtpStr.substring(1)), c: GTP_LETTERS.indexOf(letter) };
        }

        // 提取全量GTP历史，用于喂给KataGo后台
        function getFullGtpMovesHistory() {
            return moveHistory.map((snapshot, index) => {
                const nextSnapshot = moveHistory[index + 1];
                const lm = nextSnapshot ? nextSnapshot.lastMove : lastMove;
                return lm ? coordsToGtp(lm.r, lm.c) : null;
            }).filter(m => m !== null);
        }

        // ================= 核心渲染 (流式百分比) =================
        function renderFluidBoard() {
            const step = 100 / (BOARD_SIZE - 1);
            let svgStr = `<svg class="svg-layer" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = (i * step).toFixed(2);
                svgStr += `<line x1="0" y1="${pos}" x2="100" y2="${pos}" stroke="var(--board-line)" stroke-width="0.2" vector-effect="non-scaling-stroke"/>`;
                svgStr += `<line x1="${pos}" y1="0" x2="${pos}" y2="100" stroke="var(--board-line)" stroke-width="0.2" vector-effect="non-scaling-stroke"/>`;
            }
            starPoints.forEach(p => {
                svgStr += `<circle cx="${(p.c * step).toFixed(2)}" cy="${(p.r * step).toFixed(2)}" r="1" fill="var(--star-point)"/>`;
            });
            svgStr += `</svg>`;
            
            const oldSvg = document.querySelector('.svg-layer');
            if (oldSvg) oldSvg.remove();
            document.getElementById('boardWrapper').insertAdjacentHTML('afterbegin', svgStr);

            const boardDOM = document.getElementById('board'); 
            boardDOM.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = document.createElement('div');
                    hitBox.className = 'intersection';
                    hitBox.style.left = `${(c * step).toFixed(2)}%`;
                    hitBox.style.top = `${(r * step).toFixed(2)}%`;
                    hitBox.style.width = `${step}%`;
                    hitBox.style.height = `${step}%`;
                    hitBox.addEventListener('click', () => handleIntersectionClick(r, c));
                    boardDOM.appendChild(hitBox);
                }
            }
        }

        // ================= 网络通讯 =================
        function initNetwork() {
            myRoomId = 'GO-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('myIdDisplay').value = myRoomId;
            currentRoomTopic = `go/room/${myRoomId}`;
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            mqttClient.on('connect', () => mqttClient.subscribe(currentRoomTopic));
            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.senderId === myUniqueId) return;
                    handleNetworkData(data);
                } catch (e) { console.error(e); }
            });
        }

        function connectToPeer() {
            const remoteId = document.getElementById('peerIdInput').value.trim();
            if (!remoteId) return alert("请输入联机密钥");
            mqttClient.unsubscribe(currentRoomTopic);
            currentRoomTopic = `go/room/${remoteId}`;
            mqttClient.subscribe(currentRoomTopic);
            myRole = 'white';
            sendMqttMessage('join');
        }

        function sendMqttMessage(type, extraPayload = {}) {
            if (!mqttClient || !currentRoomTopic) return;
            mqttClient.publish(currentRoomTopic, JSON.stringify({ type, senderId: myUniqueId, ...extraPayload }));
        }

        function handleNetworkData(data) {
            if (data.type === 'join') {
                myRole = 'black'; updateConnectionUI(true); initBoard(); sendMqttMessage('join_ack'); toast("对手已进入，你执黑");
            } else if (data.type === 'join_ack') {
                myRole = 'white'; updateConnectionUI(true); initBoard(); toast("加入成功，你执白");
            } else if (data.type === 'move') {
                executeMoveSync(data.r, data.c);
            } else if (data.type === 'pass') {
                logPassMove(currentTurn);
                toast("对方选择停手"); currentTurn = currentTurn === 'black' ? 'white' : 'black'; updateTurnUI();
            } else if (data.type === 'reset') {
                resetBoardLocal(); toast("对局已重置");
            } else if (data.type === 'undo_request') {
                if (confirm("对方请求悔棋，是否同意？")) { executeUndoLocal(); sendMqttMessage('undo_response', { accept: true }); }
                else { sendMqttMessage('undo_response', { accept: false }); }
            } else if (data.type === 'undo_response') {
                if (data.accept) { executeUndoLocal(); toast("悔棋成功"); } else { alert("对方拒绝了你的悔棋请求。"); }
            } else if (data.type === 'resign') {
                handleGameOver(true, "对方认输");
            } else if (data.type === 'load_request') {
                const snap = data.snapshot;
                const oppRoleInSave = snap.savedAsRole;
                let myTargetRole = oppRoleInSave === 'black' ? 'white' : 'black';
                let roleText = oppRoleInSave === 'black' ? "黑方" : "白方";

                if (confirm(`📩 对方申请导入外部战局文件 (.go)\n\n同意导入后将自动组队并同步加载棋盘。是否同意？`)) {
                    applySnapshotLocal(snap, myTargetRole);
                    toast(`✅ 您同意了读档请求`);
                    sendMqttMessage('load_response', { accept: true, snapshot: snap });
                } else {
                    sendMqttMessage('load_response', { accept: false });
                }
            } else if (data.type === 'load_response') {
                if (data.accept) {
                    const snap = data.snapshot;
                    applySnapshotLocal(snap, snap.savedAsRole);
                    alert("对方已同意！战局加载完毕。");
                } else {
                    alert("对方拒绝了读档申请！");
                }
            }
        }

        // ================= 存档/读档 =================
        function saveGame() {
            if (moveHistory.length === 0 && !lastMove) return alert("当前棋盘为空，无需保存！");
            const savePacket = { boardState, currentTurn, lastMove, moveHistory, savedAsRole: myRole };
            const blob = new Blob([JSON.stringify(savePacket, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Go_Studio_Archive_${new Date().toISOString().slice(0, 10)}.go`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try { applySnapshotLocal(JSON.parse(e.target.result)); } catch (err) { alert("文件格式错误！"); }
            };
            reader.readAsText(file); event.target.value = '';
        }

        function applySnapshotLocal(snapshot, targetRole) {
            boardState = snapshot.boardState; currentTurn = snapshot.currentTurn;
            lastMove = snapshot.lastMove; moveHistory = snapshot.moveHistory;
            if (targetRole !== undefined) { myRole = targetRole; updateConnectionUI(true); }
            cancelPendingMove(); clearAssistHighlights(); renderStones(); updateTurnUI(); updateStonesCount(); rebuildMoveHistoryLog();
            if (assistModeActive) calculateBestMove();
        }

        // ================= 核心游戏逻辑 =================
        function initBoard() { resetBoardLocal(); sendMqttMessage('reset'); }

        function resetBoardLocal() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            currentTurn = 'black'; lastMove = null; moveHistory = [];
            renderStones(); updateTurnUI(); updateStonesCount(); clearAssistHighlights(); cancelPendingMove(); rebuildMoveHistoryLog();
            if (assistModeActive) calculateBestMove();
        }

        function handleIntersectionClick(r, c) {
            if (myRole !== null && currentTurn !== myRole) return;
            if (pendingMoveContext || boardState[r][c] !== null) return;
            const validation = simulatePlacementAndCheckCaptured(r, c, currentTurn);
            if (validation.isSuicide) triggerRiskInterruption(r, c);
            else commitPlacement(r, c);
        }

        function triggerRiskInterruption(r, c) {
            pendingMoveContext = { r, c };
            document.getElementById('dangerBanner').classList.add('active');
        }

        function cancelPendingMove() {
            pendingMoveContext = null;
            document.getElementById('dangerBanner').classList.remove('active');
        }

        document.getElementById('dangerConfirmBtn').onclick = () => {
            if (pendingMoveContext) { const { r, c } = pendingMoveContext; cancelPendingMove(); commitPlacement(r, c); }
        };

        function commitPlacement(r, c) {
            if (myRole !== null) sendMqttMessage('move', { r, c });
            executeMoveSync(r, c);
        }

        function getGroupInfo(startR, startC, targetBoard) {
            const color = targetBoard[startR][startC];
            if (!color) return { stones: [], liberties: 0 };
            const visited = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(false));
            const stones = []; const libertiesSet = new Set(); const queue = [{r: startR, c: startC}];
            visited[startR][startC] = true;
            const dir = [{r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1}];
            while(queue.length > 0) {
                const curr = queue.shift(); stones.push(curr);
                for(let i=0; i<4; i++) {
                    const nr = curr.r + dir[i].r; const nc = curr.c + dir[i].c;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        if (!targetBoard[nr][nc]) libertiesSet.add(`${nr},${nc}`);
                        else if (targetBoard[nr][nc] === color && !visited[nr][nc]) {
                            visited[nr][nc] = true; queue.push({r: nr, c: nc});
                        }
                    }
                }
            }
            return { stones, liberties: libertiesSet.size };
        }

        function simulatePlacementAndCheckCaptured(r, c, color) {
            const simBoard = boardState.map(row => [...row]);
            simBoard[r][c] = color;
            const enemyColor = color === 'black' ? 'white' : 'black';
            const capturedStones = [];
            const dir = [{r:-1, c:0}, {r:1, c:0}, {r:0, c:-1}, {r:0, c:1}];
            for(let i=0; i<4; i++) {
                const nr = r + dir[i].r; const nc = c + dir[i].c;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && simBoard[nr][nc] === enemyColor) {
                    const group = getGroupInfo(nr, nc, simBoard);
                    if (group.liberties === 0) {
                        group.stones.forEach(s => { if (!capturedStones.some(exist => exist.r === s.r && exist.c === s.c)) capturedStones.push(s); });
                    }
                }
            }
            capturedStones.forEach(s => simBoard[s.r][s.c] = null);
            return { isSuicide: (getGroupInfo(r, c, simBoard).liberties === 0), capturedStones };
        }

        function executeMoveSync(r, c) {
            const validation = simulatePlacementAndCheckCaptured(r, c, currentTurn);
            moveHistory.push({ board: JSON.parse(JSON.stringify(boardState)), turn: currentTurn, lastMove: lastMove ? { ...lastMove } : null, type: 'stone' });
            boardState[r][c] = currentTurn;
            validation.capturedStones.forEach(s => boardState[s.r][s.c] = null);
            lastMove = { r, c };
            renderStones(); updateStonesCount(); playStoneSound();
            
            addMoveHistoryLogItem(moveHistory.length, currentTurn, coordsToGtp(r, c));

            currentTurn = currentTurn === 'black' ? 'white' : 'black';
            updateTurnUI();
            if (assistModeActive) setTimeout(calculateBestMove, 50); // 【补全点：落子后自动驱动 AI 分析下一步】
        }

        // ================= 侧边栏历史日志刷新驱动 =================
        function addMoveHistoryLogItem(stepNum, color, gtpCoord) {
            const container = document.getElementById('moveHistoryLog');
            if (stepNum === 1) container.innerHTML = '';
            Array.from(container.children).forEach(el => el.classList.remove('active-move'));

            const item = document.createElement('div');
            item.className = 'history-item active-move';
            const colorText = color === 'black' ? '黑方' : '白方';
            item.innerHTML = `<span>第 ${stepNum} 手: ${colorText}</span> <span>${gtpCoord}</span>`;
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        }

        function logPassMove(color) {
            moveHistory.push({ board: JSON.parse(JSON.stringify(boardState)), turn: currentTurn, lastMove: lastMove ? { ...lastMove } : null, type: 'pass' });
            const container = document.getElementById('moveHistoryLog');
            if (moveHistory.length === 1) container.innerHTML = '';
            Array.from(container.children).forEach(el => el.classList.remove('active-move'));

            const item = document.createElement('div');
            item.className = 'history-item active-move';
            const colorText = color === 'black' ? '黑方' : '白方';
            item.innerHTML = `<span>第 ${moveHistory.length} 手: ${colorText}</span> <span style="color:var(--text-dim)">✋ 停手</span>`;
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        }

        function rebuildMoveHistoryLog() {
            const container = document.getElementById('moveHistoryLog');
            container.innerHTML = '';
            if (moveHistory.length === 0 && !lastMove) {
                container.innerHTML = '<div style="color: var(--text-dim); text-align: center; margin-top: 40px; font-style: italic;">暂无落子记录</div>';
                return;
            }
            moveHistory.forEach((snapshot, index) => {
                const nextSnapshot = moveHistory[index + 1];
                const lm = nextSnapshot ? nextSnapshot.lastMove : lastMove;
                const isLast = (index === moveHistory.length - 1);
                
                const item = document.createElement('div');
                item.className = `history-item ${isLast ? 'active-move' : ''}`;
                const colorText = snapshot.turn === 'black' ? '黑方' : '白方';
                
                if (snapshot.type === 'pass' || (!lm && snapshot.type !== 'stone')) {
                    item.innerHTML = `<span>第 ${index + 1} 手: ${colorText}</span> <span style="color:var(--text-dim)">✋ 停手</span>`;
                } else if (lm) {
                    item.innerHTML = `<span>第 ${index + 1} 手: ${colorText}</span> <span>${coordsToGtp(lm.r, lm.c)}</span>`;
                }
                container.appendChild(item);
            });
            container.scrollTop = container.scrollHeight;
        }

        // ================= 视图更新与计数 =================
        function renderStones() {
            const intersections = document.getElementById('board').children;
            let i = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = intersections[i++];
                    hitBox.innerHTML = ''; 
                    hitBox.classList.remove('last-move');
                    if (lastMove && lastMove.r === r && lastMove.c === c) hitBox.classList.add('last-move');
                    if (boardState[r][c]) {
                        const stoneDOM = document.createElement('div');
                        stoneDOM.className = `stone ${boardState[r][c]}`;
                        hitBox.appendChild(stoneDOM);
                    }
                }
            }
        }

        function updateStonesCount() {
            let bCount = 0, wCount = 0;
            boardState.flat().forEach(val => { if (val === 'black') bCount++; else if (val === 'white') wCount++; });
            if (!assistModeActive) {
                document.getElementById('blackEvalText').innerText = `黑 ${bCount} 目`;
                document.getElementById('whiteEvalText').innerText = `白 ${wCount} 目`;
                const total = bCount + wCount;
                const bPercent = total === 0 ? 50 : (bCount / total) * 100;
                document.getElementById('blackEvalBar').style.width = `${bPercent}%`;
                document.getElementById('whiteEvalBar').style.width = `${100 - bPercent}%`;
            }
        }

        // ================= AI 核心算法与开关交互驱动 =================
        function toggleAssistMode(force) {
            assistModeActive = force !== undefined ? force : !assistModeActive;
            if(assistModeActive && currentTurn && (!myRole || myRole === currentTurn)) {
                calculateBestMove(); // 【补全点：开启 AI 时，立刻进行第一次算力演算】
            } else { 
                clearAssistHighlights(); 
                updateStonesCount(); 
            }
        }

        function clearAssistHighlights() {
            Array.from(document.getElementById('board').children).forEach(el => el.classList.remove('assist-suggest'));
        }

        function calculateBestMove() {
            if (!currentTurn) return;
            clearAssistHighlights();
            let fullMoves = getFullGtpMovesHistory();
            if (lastMove) {
                const lastGtp = coordsToGtp(lastMove.r, lastMove.c);
                if (fullMoves.length === 0 || fullMoves[fullMoves.length - 1] !== lastGtp) fullMoves.push(lastGtp);
            }
            // 向本地后端 API 交换算力数据
            fetch('http://localhost:3000/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ moves: fullMoves, nextColor: currentTurn })
            })
            .then(res => res.json())
            .then(data => {
                let isMyTurn = (myRole === null) || (myRole === currentTurn);
                if (isMyTurn && data.bestMove && data.bestMove !== '(none)' && data.bestMove !== 'pass') {
                    const coords = gtpToCoords(data.bestMove);
                    if (coords) {
                        const index = coords.r * 19 + coords.c;
                        const target = document.getElementById('board').children[index];
                        if(target) target.classList.add('assist-suggest'); // 高亮紫圈闪烁提示点
                    }
                }
                if (data.score !== undefined) {
                    let bRate = data.score; let wRate = 100 - bRate;
                    document.getElementById('blackEvalBar').style.width = `${bRate}%`;
                    document.getElementById('whiteEvalBar').style.width = `${wRate}%`;
                    document.getElementById('blackEvalText').innerText = `黑胜率 ${bRate.toFixed(1)}%`;
                    document.getElementById('whiteEvalText').innerText = `白胜率 ${wRate.toFixed(1)}%`;
                }
            }).catch(() => {});
        }

        // ================= 控制交互 =================
        function requestUndo() {
            if (moveHistory.length === 0) return;
            if (myRole !== null) {
                if (currentTurn === myRole) return alert("必须在对方回合申请悔棋！");
                sendMqttMessage('undo_request'); toast("等待对方同意悔棋...");
            } else executeUndoLocal();
        }

        function executeUndoLocal() {
            if (moveHistory.length === 0) return;
            const prev = moveHistory.pop();
            boardState = prev.board; currentTurn = prev.turn; lastMove = prev.lastMove;
            renderStones(); updateTurnUI(); updateStonesCount(); cancelPendingMove(); rebuildMoveHistoryLog();
            if (assistModeActive) calculateBestMove(); // 【补全点：悔棋回溯后，自动重算 AI 建议】
        }

        function sendPass() {
            if (confirm("确定停手吗？")) {
                logPassMove(currentTurn);
                sendMqttMessage('pass'); currentTurn = currentTurn === 'black' ? 'white' : 'black'; updateTurnUI();
                if (assistModeActive) setTimeout(calculateBestMove, 50);
            }
        }

        function requestResign() {
            if (confirm("确定要认输吗？")) { sendMqttMessage('resign'); handleGameOver(false, "你已认输"); }
        }

        function handleGameOver(isWin, msg) {
            alert(`${msg}！游戏结束。`);
            if (isWin) matchStats.wins++; else matchStats.losses++;
            saveStats();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function updateConnectionUI(isConnected) {
            const badge = document.getElementById('connectionStatus');
            if (isConnected) {
                badge.innerText = `联机中 - 执${myRole==='black'?'黑':'白'}`;
                badge.className = "status-badge active";
            } else { badge.innerText = "单机模式"; badge.className = "status-badge"; }
            updateTurnUI();
        }

        function updateTurnUI() {
            const turnBadge = document.getElementById('turnStatus');
            const isMyTurn = (myRole !== null && currentTurn === myRole) || myRole === null;
            turnBadge.innerText = `${currentTurn === 'black' ? '黑方' : '白方'}回合 ${isMyTurn ? '(到你)' : ''}`;
            turnBadge.className = isMyTurn ? "status-badge warn" : "status-badge";
        }

        function saveStats() { localStorage.setItem('go_p2p_stats', JSON.stringify(matchStats)); updateStatsUI(); }
        function updateStatsUI() {
            document.getElementById('statWins').innerText = matchStats.wins; document.getElementById('statLosses').innerText = matchStats.losses;
            const total = matchStats.wins + matchStats.losses;
            document.getElementById('statRate').innerText = total === 0 ? "0%" : `${Math.round((matchStats.wins / total) * 100)}%`;
        }

        function copyRoomKey() { const id = document.getElementById('myIdDisplay'); id.select(); document.execCommand("copy"); }
        function toast(msg) { console.log(msg); }
        function playStoneSound() { try { const audioCtx = new(window.AudioContext||window.webkitAudioContext)(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05); } catch (e) {} }

        window.addEventListener('resize', renderFluidBoard); 
        renderFluidBoard(); resetBoardLocal(); initNetwork(); updateStatsUI();
    </script>
</body>
</html>
