<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Gomoku - Masterpiece Pro (Archive Exchange Suite)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #141418;
            --surface-sub: #1e1e24;
            --border: #2c2c35;
            --text-main: #f0f0f0;
            --text-dim: #888899;
            --board-line: #444455;
            --star-point: #888899;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 20px; }
        
        .container { display: flex; gap: 40px; max-width: 1100px; width: 100%; align-items: center; justify-content: center; }
        .sidebar { flex: 0 0 360px; width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 14px; }
        
        h1 { font-size: 1.2rem; font-weight: 300; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: center; }
        
        .switches-header { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .switch-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 6px; width: 130px; }
        .switch { position: relative; display: inline-block; width: 30px; height: 16px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 16px; border: 1px solid var(--border); }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 2px; bottom: 2px; background-color: #777; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #8a50ff; border-color: #8a50ff; }
        input:checked + .slider:before { transform: translateX(14px); background-color: #fff; }

        .label-tiny { font-size: 10px; font-weight: 600; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; }
        .panel-section { background: #0f0f12; border: 1px solid var(--border); border-radius: 8px; padding: 14px; position: relative; }
        
        .peer-id-display { font-family: monospace; font-size: 0.95rem; color: #fff; font-weight: bold; background: var(--surface-sub); padding: 10px; border-radius: 6px; border: 1px solid var(--border); text-align: center; word-break: break-all; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: var(--surface-sub); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 0.85rem; outline: none; }
        
        .btn { background: var(--text-main); color: var(--bg); border: none; padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn:hover { background: #e5e5e5; transform: translateY(-1px); color: #000; }
        .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
        .btn-secondary:hover { color: #fff; border-color: #888; background: rgba(255,255,255,0.02); }
        .btn-danger { background: #222; color: #ff4d4d; border: 1px solid #442222; }
        .btn-danger:hover { background: #331111; border-color: #ff4d4d; }

        .status-area { display: flex; flex-wrap: wrap; gap: 6px; }
        .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #222; color: var(--text-dim); }
        .status-badge.connected { background: #1b4332; color: #52b788; }
        .status-badge.your-turn { background: #431b1b; color: #ff4d4d; animation: turnPulse 2s infinite; }
        .status-badge.local-mode { background: #1a233a; color: #70a1ff; }
        .status-badge.spectator-mode { background: #3a2a1a; color: #ffb03a; }

        @keyframes turnPulse { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 8px rgba(255,77,77,0.3); } 100% { opacity: 0.8; } }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .stat-card { background: var(--surface-sub); padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
        .stats-grid .stat-card { min-width: 0; }
        .stat-val { font-size: 1.1rem; font-weight: bold; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .log-box { max-height: 110px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: var(--text-dim); line-height: 1.5; margin-top: 6px; border-top: 1px solid #222; padding-top: 6px; }
        .log-box::-webkit-scrollbar { width: 4px; }
        .log-box::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .board-wrapper {
            position: relative; background: #e4d8b8; padding: 24px; border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.15);
            border: 4px solid #bba374;
            transform-origin: center center;
            transition: transform 0.3s var(--ease), scale 0.15s var(--ease);
        }

        .svg-layer { position: absolute; top: 24px; left: 24px; pointer-events: none; z-index: 1; }
        
        .board { position: relative; width: 476px; height: 476px; z-index: 5; }
        .intersection {
            position: absolute; width: 34px; height: 34px; transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            border-radius: 50%;
        }
        .intersection::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: rgba(0,0,0,0.2); opacity: 0; transition: 0.2s; z-index: 2; }
        .intersection:hover:not(.has-stone)::after { opacity: 1; }

        .stone {
            width: 28px; height: 28px; border-radius: 50%; box-shadow: 2px 4px 6px rgba(0,0,0,0.4);
            animation: dropIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative; z-index: 10;
        }
        .stone.black { background: radial-gradient(circle at 30% 30%, #555, #111, #000); }
        .stone.white { background: radial-gradient(circle at 30% 30%, #fff, #ddd, #aaa); }

        .intersection.last-move::before { content: ""; position: absolute; width: 8px; height: 8px; background: #ff4d4d; border-radius: 50%; z-index: 15; }
        
        /* 深度修复：统一使用 3D 转换矩阵防止旋转和位移动画相互冲突遮蔽 */
        .intersection.assist-suggest::before {
            content: ""; position: absolute; top: 50%; left: 50%;
            width: 40px; height: 40px;
            border: 2px dashed rgba(140, 80, 255, 0.8); border-radius: 50%;
            animation: spinAndPulse 2s linear infinite; z-index: 20;
        }
        
        @keyframes dropIn { from { transform: scale(1.5) translateY(-20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes spinAndPulse {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.9); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(0.9); opacity: 0.5; }
        }

        .celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 12, 0.88); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.5s var(--ease);
        }
        .celebration-overlay.active { opacity: 1; pointer-events: auto; }
        .celebration-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px 64px; text-align: center; }
        .celebration-title { font-size: 3.2rem; font-weight: 200; margin-bottom: 12px; color: #fff; }
        .celebration-subtitle { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 32px; font-weight: 300; }

        @media (max-width: 950px) {
            body { padding: 20px 10px; }
            .container { flex-direction: column-reverse; gap: 20px; }
            .sidebar { width: calc(476px + 48px); max-width: 100%; flex: none; }
        }
    </style>
</head>
<body>

    <div id="celebrationOverlay" class="celebration-overlay">
        <div class="celebration-card">
            <div id="celebrationTitle" class="celebration-title">VICTORY</div>
            <div id="celebrationSubtitle" class="celebration-subtitle">Match completed beautifully.</div>
            <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px;">
                <button class="btn btn-secondary" onclick="openReplay()">复盘查看局势</button>
                <button class="btn" onclick="startNextMatchManual()">开启新局 / 攻守交替</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h1>
                Gomoku Studio Pro
                <div class="switches-header">
                    <div class="switch-wrap" title="快捷键 Ctrl+W 开关 AI 落子提示">
                        <span style="font-size: 9px; color:#8a50ff; font-weight: bold;">AI Assist</span>
                        <label class="switch">
                            <input type="checkbox" id="assistToggle" onchange="toggleAssistMode(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </h1>

            <div class="panel-section">
                <span class="label-tiny">Board Scale</span>
                <input type="range" id="zoomSlider" min="0.5" max="1.8" step="0.05" value="1" style="width: 100%; accent-color: #8a50ff; cursor: pointer;">
            </div>
            
            <div class="panel-section">
                <span class="label-tiny">Match Stats</span>
                <div class="stats-grid">
                    <div class="stat-card" style="border-color: #52b788;"><span class="label-tiny">WIN</span><div class="stat-val" id="statWins" style="color: #52b788;">0</div></div>
                    <div class="stat-card" style="border-color: #ff4d4d;"><span class="label-tiny">LOSE</span><div class="stat-val" id="statLosses" style="color: #ff4d4d;">0</div></div>
                    <div class="stat-card"><span class="label-tiny">RATE</span><div class="stat-val" id="statRate">0%</div></div>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Your Room Key</span>
                <div class="peer-id-display" id="myIdDisplay">Generating...</div>
                <button class="btn btn-secondary" style="margin-top: 8px; width: 100%;" onclick="copyRoomKey()">Copy Key</button>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Join Room</span>
                <div class="input-group">
                    <input type="text" id="peerIdInput" placeholder="Paste opponent key...">
                    <button class="btn" style="padding: 10px 10px;" onclick="connectToPeer('play')">对战</button>
                    <button class="btn btn-secondary" style="padding: 10px 10px; border-color: #ffb03a; color: #ffb03a;" onclick="connectToPeer('spectate')">观棋</button>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Game Status</span>
                <div class="status-area" style="margin-top:4px;">
                    <div id="connectionStatus" class="status-badge local-mode">Local Mode</div>
                    <div id="turnStatus" class="status-badge">Turn: Black</div>
                    <div id="roleStatus" class="status-badge" style="display:none;"></div>
                </div>
                <div class="log-box" id="logBox">系统已就绪。专业战局引擎已载入。</div>
            </div>
            
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-secondary" style="flex: 1;" id="undoBtn" onclick="requestUndo()">求情悔棋</button>
                <button class="btn btn-secondary" style="flex: 1;" id="drawBtn" onclick="requestDraw()">提议言和</button>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn btn-danger" style="flex: 1;" id="resignBtn" onclick="handleResign()">投子认输</button>
                <button class="btn btn-secondary" style="flex: 1; border-color: #8a50ff; color: #8a50ff;" id="saveBtn" onclick="saveGame()">导出存档</button>
                <button class="btn btn-secondary" style="flex: 1; border-color: #52b788; color: #52b788;" id="loadBtn" onclick="document.getElementById('fileLoadInput').click()">导入存档</button>
                <input type="file" id="fileLoadInput" accept=".gomoku" style="display:none;" onchange="handleFileSelect(event)">
            </div>
            <button class="btn btn-secondary" style="width: 100%; margin-top: 8px;" id="resetBtn" onclick="initBoard()">强制掀翻重开</button>
        </div>

        <div class="board-wrapper" id="boardWrapper">
            <div class="board" id="board"></div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 15;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let myRole = null; 
        let currentTurn = 'black'; 
        let lastMove = null;
        let moveHistory = [];
        
        // 核心改造1：建立全局真正的“物理落子先后时间链”，防止发给 AI 乱序棋谱导致报错
        let chronologicalMoves = []; 
        let gameActive = true;
        let assistModeActive = false;

        // Replay Mode Integration
        let isReplayMode = false;
        let replayStates = [];
        let currentReplayStep = 0;

        // Network Integration
        let mqttClient = null;
        let currentRoomTopic = '';
        const myUniqueId = 'UID_' + Math.random().toString(36).substr(2, 9);
        let myRoomId = '';
        let matchStats = JSON.parse(localStorage.getItem('gomoku_p2p_stats')) || { wins: 0, losses: 0 };

        const starPoints = [ {r:3,c:3}, {r:3,c:11}, {r:7,c:7}, {r:11,c:3}, {r:11,c:11} ];

        function renderSVGBoard() {
            const CS = 34; const w = (BOARD_SIZE - 1) * CS; const h = (BOARD_SIZE - 1) * CS;
            let svgStr = `<svg class="svg-layer" width="${w+2}" height="${h+2}" viewBox="-1 -1 ${w+2} ${h+2}" xmlns="http://www.w3.org/2000/svg">`;
            for (let i = 0; i < BOARD_SIZE; i++) {
                svgStr += `<line x1="0" y1="${i*CS}" x2="${w}" y2="${i*CS}" stroke="var(--board-line)" stroke-width="1.2"/>`;
                svgStr += `<line x1="${i*CS}" y1="0" x2="${i*CS}" y2="${h}" stroke="var(--board-line)" stroke-width="1.2"/>`;
            }
            starPoints.forEach(p => { svgStr += `<circle cx="${p.c*CS}" cy="${p.r*CS}" r="3.5" fill="var(--star-point)"/>`; });
            svgStr += `</svg>`;
            document.getElementById('boardWrapper').insertAdjacentHTML('afterbegin', svgStr);
        }

        function createDOMGrid() {
            const boardDOM = document.getElementById('board'); boardDOM.innerHTML = ''; const CS = 34;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = document.createElement('div');
                    hitBox.className = 'intersection'; hitBox.style.left = `${c*CS}px`; hitBox.style.top = `${r*CS}px`;
                    hitBox.dataset.row = r; hitBox.dataset.col = c;
                    hitBox.addEventListener('click', () => handleIntersectionClick(r, c));
                    boardDOM.appendChild(hitBox);
                }
            }
        }

        function initNetwork() {
            myRoomId = 'GOMOKU-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('myIdDisplay').innerText = myRoomId;
            currentRoomTopic = `gomoku/room/${myRoomId}`;
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            mqttClient.on('connect', () => { mqttClient.subscribe(currentRoomTopic); });
            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.senderId !== myUniqueId) handleNetworkData(data);
                } catch (e) {}
            });
        }

        function connectToPeer(mode = 'play') {
            const remoteId = document.getElementById('peerIdInput').value.trim();
            if (!remoteId) return alert("请输入合法的棋室密钥！");
            if (remoteId === myRoomId) return alert("无法加入自己的棋局！");
            
            mqttClient.unsubscribe(currentRoomTopic);
            currentRoomTopic = `gomoku/room/${remoteId}`;
            mqttClient.subscribe(currentRoomTopic);
            
            if (mode === 'spectate') {
                myRole = 'spectator'; sendMqttMessage('spectator_join');
                log("正在作为【观众】切入房间...");
            } else {
                myRole = 'white'; sendMqttMessage('join');
            }
        }

        function sendMqttMessage(type, extraPayload = {}) {
            if (!mqttClient || !currentRoomTopic) return;
            mqttClient.publish(currentRoomTopic, JSON.stringify({ type: type, senderId: myUniqueId, ...extraPayload }));
        }

        function handleNetworkData(data) {
            if (data.type === 'join') { myRole = 'black'; updateConnectionUI(true); initBoard(); sendMqttMessage('join_ack'); } 
            else if (data.type === 'join_ack') { myRole = 'white'; updateConnectionUI(true); initBoard(); } 
            else if (data.type === 'spectator_join') {
                log("👁️ 有新观众进入了观棋席。");
                if (myRole === 'black' || myRole === 'white') {
                    sendMqttMessage('sync_board_to_spectator', { boardState: boardState, currentTurn: currentTurn, lastMove: lastMove });
                }
            }
            else if (data.type === 'sync_board_to_spectator') {
                if (myRole === 'spectator') {
                    boardState = data.boardState; currentTurn = data.currentTurn; lastMove = data.lastMove;
                    updateConnectionUI(true); renderStones(); log("⚡ 成功同步当前的战场实时局势！");
                }
            }
            else if (data.type === 'move') { executeMoveSync(data.r, data.c); } 
            else if (data.type === 'reset') { resetBoardLocal(); log("对方重启了棋盘。"); }
            else if (data.type === 'undo_request') {
                if (myRole === 'spectator') return;
                if (confirm("对方请求悔棋，是否同意？")) { executeUndoLocal(); sendMqttMessage('undo_response', { accept: true }); } 
                else { sendMqttMessage('undo_response', { accept: false }); log("拒绝了对方的悔棋。"); }
            } 
            else if (data.type === 'undo_response') { if (data.accept) { executeUndoLocal(); log("对方同意了你的悔棋。"); } else { alert("对方拒绝了悔棋申请！"); } }
            else if (data.type === 'draw_request') {
                if (myRole === 'spectator') return;
                if (confirm("对方提议言和，接受吗？")) {
                    currentTurn = null; updateTurnUI(); sendMqttMessage('draw_response', { accept: true }); showCelebration('draw'); log("握手言和。");
                } else { sendMqttMessage('draw_response', { accept: false }); }
            } 
            else if (data.type === 'draw_response') {
                if (data.accept) { currentTurn = null; updateTurnUI(); showCelebration('draw'); log("对方同意平局。"); } else { log("对方拒绝和棋。"); }
            }
            else if (data.type === 'resign_notice') {
                log(`🎉 对方宣布投子认输！你在本场对抗中胜出。`);
                triggerMatchEnd(data.loser === 'black' ? 'white' : 'black');
            }
            else if (data.type === 'load_request') {
                if (myRole === 'spectator') return;
                const snap = data.snapshot;
                let myTargetRole = snap.savedAsRole === 'black' ? 'white' : 'black';
                if (confirm(`📩 对方申请导入外部战局 (.gomoku)\n同意后您的阵营将被重置为 [${myTargetRole === 'black'?'黑方':'白方'}]。是否同意？`)) {
                    applySnapshotLocal(snap, myTargetRole);
                    sendMqttMessage('load_response', { accept: true, snapshot: snap });
                } else {
                    sendMqttMessage('load_response', { accept: false });
                }
            }
            else if (data.type === 'load_response') {
                if (data.accept) {
                    applySnapshotLocal(data.snapshot, data.snapshot.savedAsRole); 
                    log("🎉 对方已同意导入，战局已回溯。");
                } else { alert("对方拒绝了读档申请！"); }
            }
        }

        function initBoard() { 
            if(myRole === 'spectator') return;
            resetBoardLocal(); 
            sendMqttMessage('reset'); 
        }

        function resetBoardLocal() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            currentTurn = 'black'; lastMove = null; moveHistory = []; 
            chronologicalMoves = []; // 新局重置
            gameActive = true; 
            renderStones(); updateTurnUI(); clearAssistHighlights();
            if (assistModeActive) fetchAIHint();
        }

        function handleIntersectionClick(r, c) {
            if (isReplayMode || !gameActive || boardState[r][c] !== null) return;
            if (myRole === 'spectator') return;
            if (myRole !== null && currentTurn !== myRole) return;
            
            if (myRole !== null) sendMqttMessage('move', { r, c });
            executeMoveSync(r, c);
        }

        function executeMoveSync(r, c) {
            moveHistory.push({ board: JSON.parse(JSON.stringify(boardState)), turn: currentTurn, lastMove: lastMove ? { ...lastMove } : null });
            
            // 核心改造2：严格按开局时间推进追加落子，传递完美棋谱，从源头消灭 AI 的 ERROR 报错！
            chronologicalMoves.push({ r, c, color: currentTurn === 'black' ? 1 : 2 });
            
            boardState[r][c] = currentTurn; lastMove = { r, c };
            
            renderStones(); playStoneSound();

            if (checkWinCondition(r, c, currentTurn)) {
                triggerMatchEnd(currentTurn); return;
            }

            if (checkUnstoppableWin(r, c, currentTurn)) {
                log(`[绝杀] 判定系统触发: ${currentTurn === 'black' ? '黑方' : '白方'} 形成了不可阻挡的必杀阵型。`);
                triggerMatchEnd(currentTurn, true); 
                return;
            }

            currentTurn = currentTurn === 'black' ? 'white' : 'black';
            updateTurnUI();

            if (gameActive && assistModeActive) fetchAIHint();
            else clearAssistHighlights();
        }

        // ==================== Threat Assessment Engine ====================
        function checkUnstoppableWin(r, c, color) {
            const dirs = [ {dr: 0, dc: 1}, {dr: 1, dc: 0}, {dr: 1, dc: 1}, {dr: 1, dc: -1} ];
            const getP = (row, col) => {
                if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return 'W';
                if (boardState[row][col] === color) return 'X';
                if (boardState[row][col] === null) return '.';
                return 'O';
            };

            let openFours = 0; let halfOpenFours = 0;
            for (let {dr, dc} of dirs) {
                let line = "";
                for (let i = -5; i <= 5; i++) { line += getP(r + i * dr, c + i * dc); }
                if (line.includes(".XXXX.")) { openFours++; } else {
                    let winningSpots = 0;
                    for (let i = -4; i <= 4; i++) {
                        if (getP(r + i * dr, c + i * dc) === '.') {
                            let tempLine = line.substring(0, i+5) + 'X' + line.substring(i+6);
                            if (tempLine.includes("XXXXX")) winningSpots++;
                        }
                    }
                    if (winningSpots >= 2) openFours++;
                    else if (winningSpots === 1) halfOpenFours++;
                }
            }
            if (openFours >= 1 || halfOpenFours >= 2) return true;
            return false;
        }

        function checkWinCondition(r, c, color) {
            const dirs = [{dr:0,dc:1}, {dr:1,dc:0}, {dr:1,dc:1}, {dr:1,dc:-1}];
            for (let i = 0; i < 4; i++) {
                let count = 1; const { dr, dc } = dirs[i];
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === color) { count++; nr += dr; nc += dc; }
                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === color) { count++; nr -= dr; nc -= dc; }
                if (count >= 5) return true;
            }
            return false;
        }

        // ==================== Studio Pro Tools & API ====================
        function fetchAIHint() {
            if (!gameActive) return;
            clearAssistHighlights();
            
            fetch('http://localhost:3000/api/analyze', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ history: chronologicalMoves }) // 传递绝对有序的历史棋谱
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP 状态异常: ${res.status}`);
                return res.json();
            })
            .then(data => {
                console.log("📡 [调试] 接收到原始响应数据:", data);

                let targetString = "";
                if (data && typeof data.move === 'string') {
                    targetString = data.move;
                } else if (typeof data === 'string') {
                    targetString = data;
                } else {
                    throw new Error("无法读取有效的数据文本");
                }

                // 核心改造3：越狱级高弹韧正则表达式！
                // (?:[a-zA-Z]*) 用于故意吞掉像 `n7` 里的那个错误前缀 `n`，确保紧随其后的坐标完美截获
                const match = targetString.match(/(?:[a-zA-Z]*)(\d+)\s*,\s*(\d+)\s*$/);
                
                if (match) {
                    let row = parseInt(match[1], 10);
                    let col = parseInt(match[2], 10);

                    // 自动适配 1-15 阵营和 0-14 阵营的潜在坐标偏移转换
                    if (row === 15 || col === 15) {
                        row = Math.max(0, row - 1);
                        col = Math.max(0, col - 1);
                    }

                    if (row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE && gameActive) {
                        const cell = document.querySelector(`[data-row='${row}'][data-col='${col}']`);
                        if (cell) {
                            cell.classList.add('assist-suggest');
                            log(`[AI 建议落子] 坐标抓取成功: [第 ${row} 行, 第 ${col} 列]`);
                        }
                    } else {
                        log(`[清洗异常] 提取坐标越界: r=${row}, c=${col}`);
                    }
                } else {
                    log(`<span style="color:#ffb03a;">[清洗失败] 未能从字符串 "${targetString}" 中匹配到合法坐标。</span>`);
                }
            })
            .catch((err) => {
                log(`<span style="color: #ff4d4d;">[AI 引擎通信受阻] ${err.message}</span>`);
                console.error("AI API Fetch Exception:", err);
            });
        }

        function toggleAssistMode(force) {
            assistModeActive = force !== undefined ? force : !assistModeActive;
            document.getElementById('assistToggle').checked = assistModeActive;
            log(`[AI 引擎] 智能提示已${assistModeActive?'开启':'关闭'}。`);
            if (assistModeActive && currentTurn) fetchAIHint();
            else clearAssistHighlights();
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key.toLowerCase() === 'w') { e.preventDefault(); toggleAssistMode(); }
        });

        function clearAssistHighlights() { document.querySelectorAll('.intersection').forEach(el => el.classList.remove('assist-suggest')); }

        function renderStones() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                    const oldStone = hitBox.querySelector('.stone');
                    if (oldStone) oldStone.remove();
                    hitBox.classList.remove('last-move', 'has-stone');

                    if (lastMove && lastMove.r === r && lastMove.c === c) hitBox.classList.add('last-move');

                    const val = boardState[r][c];
                    if (val) {
                        hitBox.classList.add('has-stone');
                        const stoneDOM = document.createElement('div');
                        stoneDOM.className = `stone ${val}`;
                        hitBox.appendChild(stoneDOM);
                    }
                }
            }
        }

        function playStoneSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(360, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        // ==================== Match Flow Controls ====================
        function triggerMatchEnd(winner, isInevitable = false) {
            gameActive = false; 
            const titleEl = document.getElementById('celebrationTitle');
            const subEl = document.getElementById('celebrationSubtitle');
            
            if (winner === 'draw') {
                titleEl.innerText = "DRAW"; subEl.innerText = "双方提议言和，平局。";
            } else {
                titleEl.innerText = winner === 'black' ? "黑方胜利" : "白方胜利";
                if (isInevitable) subEl.innerText = "形成绝杀之势，胜局已定无力回天！";
                else subEl.innerText = "精准落子，达成五连绝杀。";

                if (myRole === null || myRole === 'spectator') { confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }); } 
                else if (winner === myRole) { confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }); matchStats.wins++; } 
                else { matchStats.losses++; }
            }
            
            document.getElementById('celebrationOverlay').classList.add('active');
            localStorage.setItem('gomoku_p2p_stats', JSON.stringify(matchStats));
            updateStatsUI(); currentTurn = null; updateTurnUI();
        }

        function handleResign() {
            if (!currentTurn) return alert("对局尚未开始或已经结束！");
            if (!confirm("确定要投子认输吗？")) return;
            let loserColor = (myRole !== null) ? myRole : currentTurn;
            let winnerColor = loserColor === 'black' ? 'white' : 'black';
            log(`🏳️ [认输] ${loserColor === 'black' ? '黑方' : '白方'} 宣布投子认输。`);
            if (myRole !== null && myRole !== 'spectator') sendMqttMessage('resign_notice', { loser: myRole });
            triggerMatchEnd(winnerColor);
        }

        function requestUndo() {
            if (myRole === 'spectator' || !gameActive) return;
            if (moveHistory.length === 0) return alert("没有可以撤销的步骤。");
            
            if (myRole !== null) {
                if (currentTurn === myRole) return alert("必须在对方回合期间才能申请悔棋！");
                sendMqttMessage('undo_request'); log("已向对方发送悔棋请求...");
            } else { executeUndoLocal(); }
        }

        function executeUndoLocal() {
            if (moveHistory.length === 0) return;
            const prev = moveHistory.pop();
            chronologicalMoves.pop(); // 悔棋时同步剔除落子链

            boardState = prev.board; currentTurn = prev.turn; lastMove = prev.lastMove;
            gameActive = true; renderStones(); updateTurnUI();
            if (assistModeActive) fetchAIHint();
        }

        function requestDraw() {
            if (myRole === 'spectator' || !gameActive) return;
            if (myRole !== null) { log("正在向对方发送和棋协议..."); sendMqttMessage('draw_request'); } 
            else { log("单机演练：直接以平局闭幕。"); triggerMatchEnd('draw'); }
        }

        function startNextMatchManual() {
            document.getElementById('celebrationOverlay').classList.remove('active');
            resetBoardLocal();
            log("[战局重置] 战场初始化完毕，新对局已启动。");
        }

        // ==================== Save & Load Mechanics ====================
        function saveGame() {
            if (!currentTurn) return alert("当前没有正在进行的对局可以保存！");
            const savePacket = { 
                boardState: boardState, currentTurn: currentTurn, 
                lastMove: lastMove, moveHistory: moveHistory,
                chronologicalMoves: chronologicalMoves, savedAsRole: myRole 
            };
            const blob = new Blob([JSON.stringify(savePacket, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `Gomoku_Studio_Archive_${new Date().toISOString().slice(0, 10)}.gomoku`; 
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            log("💾 [数据中心] 棋盘回溯文件已导出。");
        }

        function handleFileSelect(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const snapshot = JSON.parse(e.target.result);
                    if (myRole === null) { applySnapshotLocal(snapshot); log("📂 本地读档成功。"); } 
                    else if (myRole !== 'spectator') {
                        log("📡 正在向对方发出【导入读档】双向确认...");
                        sendMqttMessage('load_request', { snapshot: snapshot });
                    }
                } catch (err) { alert("文件解析错误！"); }
            };
            reader.readAsText(file); event.target.value = ''; 
        }

        function applySnapshotLocal(snapshot, targetRole) {
            boardState = snapshot.boardState; currentTurn = snapshot.currentTurn;
            lastMove = snapshot.lastMove; moveHistory = snapshot.moveHistory;
            chronologicalMoves = snapshot.chronologicalMoves || []; // 恢复历史时序

            if (targetRole) { myRole = targetRole; updateConnectionUI(true); }
            renderStones(); updateTurnUI(); gameActive = true;
            if (assistModeActive) fetchAIHint();
        }

        // ==================== UI Updates ====================
        function updateConnectionUI(isConnected) {
            const badge = document.getElementById('connectionStatus'); 
            const rBadge = document.getElementById('roleStatus');
            const btns = [document.getElementById('undoBtn'), document.getElementById('drawBtn'), document.getElementById('resignBtn'), document.getElementById('resetBtn')];

            if (isConnected) {
                if (myRole === 'spectator') {
                    badge.innerText = "实时观棋"; badge.className = "status-badge spectator-mode";
                    rBadge.style.display = "inline-block"; rBadge.innerText = "旁观者";
                    btns.forEach(b => { b.disabled = true; b.style.opacity = 0.4; });
                } else {
                    badge.innerText = "网络对战"; badge.className = "status-badge connected";
                    rBadge.style.display = "inline-block"; rBadge.innerText = myRole === 'black' ? "黑子(先手)" : "白子(后手)";
                    btns.forEach(b => { b.disabled = false; b.style.opacity = 1; });
                }
            } else {
                badge.innerText = "离线单机"; badge.className = "status-badge local-mode"; rBadge.style.display = "none";
                btns.forEach(b => { b.disabled = false; b.style.opacity = 1; });
            }
            updateTurnUI();
        }

        function updateTurnUI() {
            const turnBadge = document.getElementById('turnStatus'); 
            if (!gameActive && !currentTurn) { turnBadge.innerText = "对局结束"; turnBadge.className = "status-badge"; return; }
            const name = currentTurn === 'black' ? '黑方' : '白方'; 
            turnBadge.innerText = `当前回合: ${name}`;
            if (myRole !== null && myRole !== 'spectator' && currentTurn === myRole) { 
                turnBadge.className = "status-badge your-turn"; turnBadge.innerText += " (轮到你)"; 
            } else { turnBadge.className = "status-badge"; }
        }

        function updateStatsUI() {
            document.getElementById('statWins').innerText = matchStats.wins;
            document.getElementById('statLosses').innerText = matchStats.losses;
            const total = matchStats.wins + matchStats.losses;
            document.getElementById('statRate').innerText = total === 0 ? "0%" : `${Math.round((matchStats.wins / total) * 100)}%`;
        }

        function copyRoomKey() { navigator.clipboard.writeText(document.getElementById('myIdDisplay').innerText); log("钥匙复制成功！"); }
        function log(text) { 
            const logBox = document.getElementById('logBox'); 
            logBox.innerHTML += `<br><span style="color:#666">[${new Date().toLocaleTimeString().split(' ')[0]}]</span> ${text}`; 
            logBox.scrollTop = logBox.scrollHeight; 
        }

        // ==================== Zoom Level Logic ====================
        let boardZoomLevel = 1;
        document.getElementById('zoomSlider')?.addEventListener('input', (e) => { boardZoomLevel = parseFloat(e.target.value); updateBoardZoom(); });
        document.querySelector('.board-wrapper')?.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault(); const delta = e.deltaY > 0 ? -0.05 : 0.05;
                boardZoomLevel = Math.max(0.5, Math.min(1.8, boardZoomLevel + delta));
                const slider = document.getElementById('zoomSlider'); if (slider) slider.value = boardZoomLevel;
                updateBoardZoom();
            }
        }, { passive: false });
        function updateBoardZoom() { const boardContainer = document.querySelector('.board-wrapper'); if (boardContainer) boardContainer.style.scale = boardZoomLevel; }

        // ==================== Replay Mode Logic ====================
        function openReplay() {
            document.getElementById('celebrationOverlay').classList.remove('active');
            const states = [...moveHistory, { board: JSON.parse(JSON.stringify(boardState)), turn: currentTurn, lastMove: lastMove ? JSON.parse(JSON.stringify(lastMove)) : null }];
            localStorage.setItem('gomoku_replay_data', JSON.stringify(states));
            window.open(window.location.href.split('?')[0] + '?mode=replay', '_blank');
        }

        function initReplayMode() {
            isReplayMode = true;
            document.querySelector('h1').innerHTML = 'Replay Room <div class="status-badge spectator-mode">Replay Mode</div>';
            const panels = document.querySelectorAll('.panel-section');
            if (panels.length >= 5) { panels[3].style.display = 'none'; panels[4].style.display = 'none'; }
            document.getElementById('undoBtn').parentElement.style.display = 'none';
            document.getElementById('resignBtn').parentElement.style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';

            const replayUI = document.createElement('div');
            replayUI.style = "display: flex; gap: 8px; margin-top: 16px;";
            replayUI.innerHTML = `
                <button class="btn btn-secondary" style="flex: 1; color: #8a50ff; border-color: #8a50ff;" onclick="replayPrev()">上一步 (Prev)</button>
                <button class="btn btn-secondary" style="flex: 1; color: #52b788; border-color: #52b788;" onclick="replayNext()">下一步 (Next)</button>
            `;
            document.querySelector('.sidebar').appendChild(replayUI);

            try {
                replayStates = JSON.parse(localStorage.getItem('gomoku_replay_data')) || [];
                if (replayStates.length === 0) throw new Error("No data");
            } catch (e) { alert("Replay data not found!"); return; }

            currentReplayStep = replayStates.length - 1; applyReplayState(currentReplayStep);
            log("📺 已进入复盘模式。");
            const connStatus = document.getElementById('connectionStatus'); connStatus.innerText = "Replay Mode"; connStatus.className = "status-badge spectator-mode";
        }

        function applyReplayState(index) {
            if (index < 0 || index >= replayStates.length) return;
            const state = replayStates[index]; boardState = state.board; currentTurn = state.turn; lastMove = state.lastMove;
            renderStones(); updateTurnUI(); log(`[Replay] 步骤: ${index} / ${replayStates.length - 1}`);
        }
        function replayPrev() { if (currentReplayStep > 0) applyReplayState(--currentReplayStep); }
        function replayNext() { if (currentReplayStep < replayStates.length - 1) applyReplayState(++currentReplayStep); }

        // ==================== Initialization ====================
        renderSVGBoard(); createDOMGrid(); 
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'replay') { initReplayMode(); } 
        else { resetBoardLocal(); initNetwork(); updateStatsUI(); }
    </script>
</body>
</html>
