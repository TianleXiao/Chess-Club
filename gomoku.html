<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Gomoku - Masterpiece Pro (Node AI Edition)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #141418;
            --surface-sub: #1e1e24;
            --border: #2c2c35;
            --text-main: #f0f0f0;
            --text-dim: #888899;
            --board-line: #444455;
            --star-point: #888899;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 20px; }
        
        .container { display: flex; gap: 40px; max-width: 1100px; width: 100%; align-items: center; justify-content: center; }
        .sidebar { flex: 0 0 340px; width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 14px; }
        
        h1 { font-size: 1.2rem; font-weight: 300; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: center; }
        
        /* Switch UI */
        .switches-header { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .switch-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 6px; width: 130px; }
        .switch { position: relative; display: inline-block; width: 30px; height: 16px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 16px; border: 1px solid var(--border); }
        .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 2px; bottom: 2px; background-color: #777; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #8a50ff; border-color: #8a50ff; }
        input:checked + .slider:before { transform: translateX(14px); background-color: #fff; }

        .label-tiny { font-size: 10px; font-weight: 600; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; }
        .panel-section { background: #0f0f12; border: 1px solid var(--border); border-radius: 8px; padding: 14px; position: relative; }
        
        .eval-container { height: 4px; width: 100%; background: #22222a; border-radius: 2px; margin-top: 8px; display: flex; overflow: hidden; }
        .eval-bar-black { height: 100%; background: #111; width: 50%; transition: width 0.4s var(--ease); }
        .eval-bar-white { height: 100%; background: #fff; width: 50%; transition: width 0.4s var(--ease); }
        .eval-labels { display: flex; justify-content: space-between; font-size: 11px; margin-top: 2px; }

        .peer-id-display { font-family: monospace; font-size: 0.95rem; color: #fff; font-weight: bold; background: var(--surface-sub); padding: 10px; border-radius: 6px; border: 1px solid var(--border); text-align: center; word-break: break-all; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: var(--surface-sub); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 0.85rem; outline: none; }
        
        .btn { background: var(--text-main); color: var(--bg); border: none; padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn:hover { background: #e5e5e5; transform: translateY(-1px); }
        .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
        .btn-secondary:hover { color: #fff; border-color: #888; background: rgba(255,255,255,0.02); }

        .status-area { display: flex; flex-wrap: wrap; gap: 6px; }
        .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #222; color: var(--text-dim); }
        .status-badge.connected { background: #1b4332; color: #52b788; }
        .status-badge.your-turn { background: #431b1b; color: #ff4d4d; animation: turnPulse 2s infinite; }
        .status-badge.local-mode { background: #1a233a; color: #70a1ff; }

        @keyframes turnPulse { 0% { opacity: 0.8; } 50% { opacity: 1; box-shadow: 0 0 8px rgba(255,77,77,0.3); } 100% { opacity: 0.8; } }

        /* Board Styling */
        .board-wrapper {
            position: relative; background: #e4d8b8; padding: 24px; border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.15);
            border: 4px solid #bba374;
        }

        .svg-layer { position: absolute; top: 24px; left: 24px; pointer-events: none; z-index: 1; }
        
        .board { position: relative; width: 476px; height: 476px; z-index: 5; }
        .intersection {
            position: absolute; width: 34px; height: 34px; transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            border-radius: 50%;
        }
        .intersection::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: rgba(0,0,0,0.2); opacity: 0; transition: 0.2s; z-index: 2; }
        .intersection:hover:not(.has-stone)::after { opacity: 1; }

        .stone {
            width: 28px; height: 28px; border-radius: 50%; box-shadow: 2px 4px 6px rgba(0,0,0,0.4);
            animation: dropIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative; z-index: 10;
        }
        .stone.black { background: radial-gradient(circle at 30% 30%, #555, #111, #000); }
        .stone.white { background: radial-gradient(circle at 30% 30%, #fff, #ddd, #aaa); }

        .intersection.last-move::before { content: ""; position: absolute; width: 8px; height: 8px; background: #ff4d4d; border-radius: 50%; z-index: 15; }
        
        /* AI Assist UI */
        .intersection.assist-suggest::before {
            content: ""; position: absolute; width: 40px; height: 40px;
            border: 2px dashed rgba(140, 80, 255, 0.8); border-radius: 50%;
            animation: spin 6s linear infinite, pulse 1.5s infinite; z-index: 20;
        }
        
        @keyframes dropIn { from { transform: scale(1.5) translateY(-20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.5; } }

        .celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 10, 12, 0.88); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.5s var(--ease);
        }
        .celebration-overlay.active { opacity: 1; pointer-events: auto; }
        .celebration-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px 64px; text-align: center; }
        .celebration-title { font-size: 3.2rem; font-weight: 200; margin-bottom: 12px; color: #fff; }
    </style>
</head>
<body>

    <div id="celebrationOverlay" class="celebration-overlay">
        <div class="celebration-card">
            <div id="celebrationTitle" class="celebration-title">VICTORY</div>
            <div id="celebrationSubtitle" style="color: var(--text-dim); margin-bottom: 24px;">Match completed beautifully.</div>
            <button class="btn btn-secondary" onclick="document.getElementById('celebrationOverlay').classList.remove('active'); initBoard();">开启新局</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h1>
                Gomoku Studio
                <div class="switches-header">
                    <div class="switch-wrap" title="快捷键 Ctrl+W 开关 AI 助手">
                        <span style="font-size: 9px; color:#8a50ff; font-weight: bold;">AI Assist</span>
                        <label class="switch">
                            <input type="checkbox" id="assistToggle" onchange="toggleAssistMode(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="switch-wrap" title="AI回合是否自动落子">
                        <span style="font-size: 9px; color:#2a9d8f; font-weight: bold;">Auto Move</span>
                        <label class="switch">
                            <input type="checkbox" id="autoMoveToggle" onchange="toggleAutoMoveMode(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </h1>
            
            <div class="panel-section">
                <span class="label-tiny">Match Stats</span>
                <div class="stats-grid">
                    <div class="stat-card" style="border-color: #52b788;"><span class="label-tiny">WIN</span><div class="stat-val" id="statWins" style="color: #52b788;">0</div></div>
                    <div class="stat-card" style="border-color: #ff4d4d;"><span class="label-tiny">LOSE</span><div class="stat-val" id="statLosses" style="color: #ff4d4d;">0</div></div>
                    <div class="stat-card"><span class="label-tiny">RATE</span><div class="stat-val" id="statRate">0%</div></div>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Your Room Key</span>
                <div class="peer-id-display" id="myIdDisplay">Generating...</div>
                <button class="btn btn-secondary" style="margin-top: 8px; width: 100%;" onclick="copyRoomKey()">Copy Key</button>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Join Room</span>
                <div class="input-group">
                    <input type="text" id="peerIdInput" placeholder="Paste opponent key...">
                    <button class="btn" style="padding: 10px 10px;" onclick="connectToPeer()">对战</button>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">Game Status</span>
                <div class="status-area" style="margin-top:4px;">
                    <div id="connectionStatus" class="status-badge local-mode">Local Mode</div>
                    <div id="turnStatus" class="status-badge">Turn: Black</div>
                    <div id="roleStatus" class="status-badge" style="display:none;"></div>
                </div>
                <div class="log-box" id="logBox">系统已就绪。</div>
            </div>
            
            <button class="btn" style="width: 100%; background: #2a9d8f; color:#fff;" onclick="startAIMatch()">⚔️ 启动专业AI对战 (执黑)</button>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn btn-secondary" style="flex: 1;" onclick="requestUndo()">悔棋</button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="initBoard()">重新开始</button>
            </div>
        </div>

        <div class="board-wrapper" id="boardWrapper">
            <div class="board" id="board"></div>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 15;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let myRole = null; 
        let currentTurn = 'black'; 
        let lastMove = null;
        let moveHistory = [];
        let gameActive = true;
        
        // AI core variables
        let assistModeActive = false;
        let autoMoveActive = false; 
        let playAgainstAI = false; 
        let aiRole = 'white'; 
        let aiThinking = false;

        let mqttClient = null;
        let currentRoomTopic = '';
        const myUniqueId = 'UID_' + Math.random().toString(36).substr(2, 9);
        let myRoomId = '';
        let matchStats = JSON.parse(localStorage.getItem('gomoku_p2p_stats')) || { wins: 0, losses: 0 };

        const starPoints = [ {r:3,c:3}, {r:3,c:11}, {r:7,c:7}, {r:11,c:3}, {r:11,c:11} ];

        function renderSVGBoard() {
            const CS = 34; const w = (BOARD_SIZE - 1) * CS; const h = (BOARD_SIZE - 1) * CS;
            let svgStr = `<svg class="svg-layer" width="${w+2}" height="${h+2}" viewBox="-1 -1 ${w+2} ${h+2}" xmlns="http://www.w3.org/2000/svg">`;
            for (let i = 0; i < BOARD_SIZE; i++) {
                svgStr += `<line x1="0" y1="${i*CS}" x2="${w}" y2="${i*CS}" stroke="var(--board-line)" stroke-width="1.2"/>`;
                svgStr += `<line x1="${i*CS}" y1="0" x2="${i*CS}" y2="${h}" stroke="var(--board-line)" stroke-width="1.2"/>`;
            }
            starPoints.forEach(p => { svgStr += `<circle cx="${p.c*CS}" cy="${p.r*CS}" r="3.5" fill="var(--star-point)"/>`; });
            svgStr += `</svg>`;
            document.getElementById('boardWrapper').insertAdjacentHTML('afterbegin', svgStr);
        }

        function createDOMGrid() {
            const boardDOM = document.getElementById('board'); boardDOM.innerHTML = ''; const CS = 34;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = document.createElement('div');
                    hitBox.className = 'intersection'; hitBox.style.left = `${c*CS}px`; hitBox.style.top = `${r*CS}px`;
                    hitBox.dataset.row = r; hitBox.dataset.col = c;
                    hitBox.addEventListener('click', () => handleIntersectionClick(r, c));
                    boardDOM.appendChild(hitBox);
                }
            }
        }

        function initNetwork() {
            myRoomId = 'GOMOKU-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('myIdDisplay').innerText = myRoomId;
            currentRoomTopic = `gomoku/room/${myRoomId}`;
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            mqttClient.on('connect', () => { mqttClient.subscribe(currentRoomTopic); });
            mqttClient.on('message', (topic, message) => {
                if(playAgainstAI) return;
                try {
                    const data = JSON.parse(message.toString());
                    if (data.senderId !== myUniqueId) handleNetworkData(data);
                } catch (e) {}
            });
        }

        function connectToPeer() {
            playAgainstAI = false;
            const remoteId = document.getElementById('peerIdInput').value.trim();
            if (!remoteId) return alert("请输入合法的棋室密钥！");
            mqttClient.unsubscribe(currentRoomTopic);
            currentRoomTopic = `gomoku/room/${remoteId}`;
            mqttClient.subscribe(currentRoomTopic);
            myRole = 'white'; sendMqttMessage('join');
        }

        function sendMqttMessage(type, extraPayload = {}) {
            if (playAgainstAI || !mqttClient || !currentRoomTopic) return;
            mqttClient.publish(currentRoomTopic, JSON.stringify({ type: type, senderId: myUniqueId, ...extraPayload }));
        }

        function handleNetworkData(data) {
            if (data.type === 'join') { myRole = 'black'; updateConnectionUI(true); initBoard(); sendMqttMessage('join_ack'); } 
            else if (data.type === 'join_ack') { myRole = 'white'; updateConnectionUI(true); initBoard(); } 
            else if (data.type === 'move') { executeMoveSync(data.r, data.c); } 
            else if (data.type === 'reset') { resetBoardLocal(); log("对方重启了棋局。"); }
            else if (data.type === 'undo_request') {
                if (confirm("对方请求悔棋，是否同意？")) { executeUndoLocal(); sendMqttMessage('undo_response', { accept: true }); } 
                else { sendMqttMessage('undo_response', { accept: false }); }
            } 
            else if (data.type === 'undo_response') { if (data.accept) { executeUndoLocal(); } }
        }

        function initBoard() { resetBoardLocal(); sendMqttMessage('reset'); }

        function resetBoardLocal() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            currentTurn = 'black'; lastMove = null; moveHistory = []; gameActive = true; aiThinking = false;
            renderStones(); updateTurnUI(); clearAssistHighlights();
            if (playAgainstAI && currentTurn === aiRole) {
                if (autoMoveActive) fetchAIOptimalMove();
                else fetchAIHint();
            }
            else if (assistModeActive) fetchAIHint();
        }

        function handleIntersectionClick(r, c) {
            if (!gameActive || aiThinking || boardState[r][c] !== null) return;
            if (myRole !== null && currentTurn !== myRole && !playAgainstAI) return;
            if (playAgainstAI && currentTurn === aiRole && autoMoveActive) return;
            
            if (myRole !== null && !playAgainstAI) sendMqttMessage('move', { r, c });
            executeMoveSync(r, c);
        }

        function executeMoveSync(r, c) {
            moveHistory.push({ board: JSON.parse(JSON.stringify(boardState)), turn: currentTurn, lastMove: lastMove ? { ...lastMove } : null });
            boardState[r][c] = currentTurn; lastMove = { r, c };
            
            renderStones(); playStoneSound();

            if (checkWinCondition(r, c, currentTurn)) {
                triggerMatchEnd(currentTurn); return;
            }

            currentTurn = currentTurn === 'black' ? 'white' : 'black';
            updateTurnUI();

            if (gameActive) {
                if (playAgainstAI && currentTurn === aiRole) {
                    if (autoMoveActive) {
                        fetchAIOptimalMove();
                    } else {
                        fetchAIHint();
                    }
                } else if (assistModeActive) {
                    fetchAIHint();
                } else {
                    clearAssistHighlights();
                }
            }
        }

        // =========================================================
        //  Core logic for HTTP requests to Node.js server
        // =========================================================
        
        // Generate history format required by Piskvork
        function generateAIHistory() {
            let history = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (boardState[r][c] === 'black') history.push({ r, c, color: 1 });
                    if (boardState[r][c] === 'white') history.push({ r, c, color: 2 });
                }
            }
            return history;
        }

        // AI automatic move execution
        function fetchAIOptimalMove() {
            if (!gameActive) return;
            aiThinking = true;
            updateTurnUI();
            log("🧠 正在请求 Node.js 引擎算力，深度解析博弈树...");

            fetch('http://localhost:3000/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ history: generateAIHistory() })
            })
            .then(res => res.json())
            .then(data => {
                aiThinking = false;
                if (data && data.r !== undefined && data.c !== undefined) {
                    executeMoveSync(data.r, data.c);
                }
            })
            .catch(err => {
                aiThinking = false;
                updateTurnUI();
                log("❌ 后端引擎连接失败，请确保 server.js 已在 3000 端口启动。");
            });
        }

        // AI assist hint (visual hint only)
        function fetchAIHint() {
            if (!gameActive || aiThinking) return;
            clearAssistHighlights();
            
            fetch('http://localhost:3000/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ history: generateAIHistory() })
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.r !== undefined && gameActive) {
                    const cell = document.querySelector(`[data-row='${data.r}'][data-col='${data.c}']`);
                    if (cell) cell.classList.add('assist-suggest');
                }
            }).catch(() => {}); // Silent catch on failure
        }

        function toggleAssistMode(force) {
            assistModeActive = force !== undefined ? force : !assistModeActive;
            document.getElementById('assistToggle').checked = assistModeActive;
            log(`[AI 引擎] 智能路线提示已${assistModeActive?'开启':'关闭'}。`);
            if (assistModeActive && currentTurn) fetchAIHint();
            else clearAssistHighlights();
        }

        function toggleAutoMoveMode(active) {
            autoMoveActive = active;
            log(`[AI 引擎] 自动落子功能已${autoMoveActive?'开启':'关闭'}。`);
            if (gameActive && playAgainstAI && currentTurn === aiRole) {
                if (autoMoveActive) {
                    fetchAIOptimalMove();
                } else {
                    fetchAIHint();
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key.toLowerCase() === 'w') { e.preventDefault(); toggleAssistMode(); }
        });

        function clearAssistHighlights() {
            document.querySelectorAll('.intersection').forEach(el => el.classList.remove('assist-suggest'));
        }

        function startAIMatch() {
            playAgainstAI = true; myRole = 'black'; aiRole = 'white';
            updateConnectionUI(false); initBoard();
            log("🤖 已连入本地 Node 算力池。人机对抗开启，你执黑先手！");
        }

        // =========================================================

        function checkWinCondition(r, c, color) {
            const dirs = [{dr:0,dc:1}, {dr:1,dc:0}, {dr:1,dc:1}, {dr:1,dc:-1}];
            for (let i = 0; i < 4; i++) {
                let count = 1; const { dr, dc } = dirs[i];
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === color) { count++; nr += dr; nc += dc; }
                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && boardState[nr][nc] === color) { count++; nr -= dr; nc -= dc; }
                if (count >= 5) return true;
            }
            return false;
        }

        function renderStones() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const hitBox = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                    const oldStone = hitBox.querySelector('.stone');
                    if (oldStone) oldStone.remove();
                    hitBox.classList.remove('last-move', 'has-stone');

                    if (lastMove && lastMove.r === r && lastMove.c === c) hitBox.classList.add('last-move');

                    const val = boardState[r][c];
                    if (val) {
                        hitBox.classList.add('has-stone');
                        const stoneDOM = document.createElement('div');
                        stoneDOM.className = `stone ${val}`;
                        hitBox.appendChild(stoneDOM);
                    }
                }
            }
        }

        function playStoneSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(360, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function triggerMatchEnd(winner) {
            gameActive = false; aiThinking = false;
            document.getElementById('celebrationTitle').innerText = winner === 'black' ? "黑方胜" : "白方胜";
            document.getElementById('celebrationOverlay').classList.add('active');
            confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } });

            if (playAgainstAI) {
                if (winner === myRole) matchStats.wins++; else matchStats.losses++;
            } else if (myRole !== null) {
                if (winner === myRole) matchStats.wins++; else matchStats.losses++;
            }
            localStorage.setItem('gomoku_p2p_stats', JSON.stringify(matchStats));
            updateStatsUI();
        }

        function requestUndo() {
            if (aiThinking) return;
            if (moveHistory.length === 0) return alert("没有可以撤销的步骤。");
            
            if (playAgainstAI) {
                if (moveHistory.length >= 2) { executeUndoLocal(); executeUndoLocal(); } 
                else { executeUndoLocal(); }
            } else if (myRole !== null) {
                sendMqttMessage('undo_request');
            } else { executeUndoLocal(); }
        }

        function executeUndoLocal() {
            if (moveHistory.length === 0) return;
            const prev = moveHistory.pop();
            boardState = prev.board; currentTurn = prev.turn; lastMove = prev.lastMove;
            gameActive = true; renderStones(); updateTurnUI();
            if (playAgainstAI && currentTurn === aiRole) {
                if (autoMoveActive) fetchAIOptimalMove();
                else fetchAIHint();
            }
            else if (assistModeActive) fetchAIHint();
        }

        function updateConnectionUI(isConnected) {
            const badge = document.getElementById('connectionStatus'); 
            const rBadge = document.getElementById('roleStatus');
            if (playAgainstAI) {
                badge.innerText = "🤖 引擎对战"; badge.className = "status-badge local-mode";
                rBadge.style.display = "inline-block"; rBadge.innerText = "你执黑子";
            } else if (isConnected) {
                badge.innerText = "网络对战"; badge.className = "status-badge connected";
                rBadge.style.display = "inline-block"; rBadge.innerText = myRole === 'black' ? "黑子(先手)" : "白子(后手)";
            } else {
                badge.innerText = "离线单机"; badge.className = "status-badge local-mode"; rBadge.style.display = "none";
            }
            updateTurnUI();
        }

        function updateTurnUI() {
            const turnBadge = document.getElementById('turnStatus'); 
            if (!gameActive) { turnBadge.innerText = "对局结束"; return; }
            
            if (playAgainstAI && currentTurn === aiRole && aiThinking) {
                turnBadge.innerText = "引擎深度计算中...";
                turnBadge.className = "status-badge local-mode";
                return;
            }
            const name = currentTurn === 'black' ? '黑方' : '白方'; 
            turnBadge.innerText = `当前回合: ${name}`;
            if (myRole !== null && currentTurn === myRole) { 
                turnBadge.className = "status-badge your-turn"; turnBadge.innerText += " (轮到你)"; 
            } else { turnBadge.className = "status-badge"; }
        }

        function updateStatsUI() {
            document.getElementById('statWins').innerText = matchStats.wins;
            document.getElementById('statLosses').innerText = matchStats.losses;
            const total = matchStats.wins + matchStats.losses;
            document.getElementById('statRate').innerText = total === 0 ? "0%" : `${Math.round((matchStats.wins / total) * 100)}%`;
        }

        function copyRoomKey() { navigator.clipboard.writeText(document.getElementById('myIdDisplay').innerText); }
        function log(text) { 
            const logBox = document.getElementById('logBox'); 
            logBox.innerHTML += `<br><span style="color:#666">[${new Date().toLocaleTimeString().split(' ')[0]}]</span> ${text}`; 
            logBox.scrollTop = logBox.scrollHeight; 
        }

        renderSVGBoard(); createDOMGrid(); resetBoardLocal(); initNetwork(); updateStatsUI();
    </script>
</body>
</html>
