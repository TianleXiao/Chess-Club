<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Board Studio - Premium Hub</title>
    <style>
        :root {
            --bg-base: #030305;
            --bg-glow: #13131a;
            --glass-bg: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-hover: rgba(255, 255, 255, 0.15);
            --text-main: #f5f5f7;
            --text-dim: #888899;
            --accent: #ffffff;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-image: radial-gradient(circle at 50% 0%, var(--bg-glow) 0%, var(--bg-base) 70%);
        }

        /* 1. Selection Lobby Layout */
        .lobby-container {
            position: relative; z-index: 5; max-width: 1200px; width: 100%; padding: 40px;
            display: flex; flex-direction: column; gap: 60px; 
            transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo);
        }
        
        .lobby-container.hidden {
            opacity: 0; transform: translateY(-20px) scale(0.98); pointer-events: none;
        }

        /* Hero Typography */
        .hero-section { text-align: center; display: flex; flex-direction: column; gap: 16px; animation: fadeUp 1s var(--ease-out-expo) forwards; }
        
        .hero-title { 
            font-size: clamp(2rem, 5vw, 4rem); 
            font-weight: 200; 
            letter-spacing: 0.18em; 
            text-transform: uppercase; 
            background: linear-gradient(180deg, #ffffff 0%, #888899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero-subtitle { 
            font-size: 0.9rem; 
            color: var(--text-dim); 
            font-weight: 300; 
            letter-spacing: 0.2em; 
            text-transform: uppercase;
        }

        /* Glassmorphism Cards Grid */
        .cards-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px; 
            perspective: 1000px;
        }

        .game-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            gap: 24px;
            cursor: pointer; 
            transition: all 0.5s var(--ease-out-expo);
            position: relative; 
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUpCard 1s var(--ease-out-expo) forwards;
        }

        .game-card:nth-child(1) { animation-delay: 0.1s; }
        .game-card:nth-child(2) { animation-delay: 0.2s; }
        .game-card:nth-child(3) { animation-delay: 0.3s; }

        .game-card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, -20%), rgba(255,255,255,0.08) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
        }

        .game-card:hover {
            transform: translateY(-8px) translateZ(20px); 
            border-color: var(--glass-border-hover);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255,255,255,0.02);
        }

        .game-card:hover::before { opacity: 1; }

        .card-icon {
            height: 60px; width: 60px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 10px; transition: transform 0.5s var(--ease-out-expo);
        }
        
        .game-card:hover .card-icon { transform: scale(1.1) rotate(5deg); background: rgba(255,255,255,0.08); }

        .icon-svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 1.5; fill: none; opacity: 0.8; }

        .card-meta { display: flex; flex-direction: column; gap: 8px; }
        .card-title { font-size: 1.4rem; font-weight: 300; letter-spacing: 0.05em; color: #ffffff; }
        .card-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; font-weight: 300; flex-grow: 1; }

        .enter-action {
            font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--text-dim); display: flex; align-items: center; gap: 8px; margin-top: 10px;
            transition: color 0.3s ease;
        }
        .enter-action svg { width: 14px; height: 14px; transition: transform 0.3s ease; }
        .game-card:hover .enter-action { color: #ffffff; }
        .game-card:hover .enter-action svg { transform: translateX(5px); }

        /* 2. Full-Screen Arena Workspace */
        .arena-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10; opacity: 0; pointer-events: none; transform: scale(1.02);
            transition: opacity 0.6s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
            background: #000; 
        }

        .arena-container.active {
            opacity: 1; pointer-events: auto; transform: scale(1);
        }

        /* CRITICAL RENDER FIX: Replaced display:none with off-screen positioning to reserve rendering sizes */
        .game-frame { 
            position: absolute;
            top: 0;
            left: -99999px;
            width: 100%; 
            height: 100%; 
            border: none; 
            background: transparent; 
            visibility: hidden;
        }
        .game-frame.active { 
            left: 0;
            visibility: visible;
        }

        /* Floating Controller Hub (Top Left) */
        .hub-back-trigger {
            position: absolute; top: 30px; left: 30px; z-index: 99;
            background: rgba(15, 15, 18, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); color: #fff;
            padding: 12px 24px; border-radius: 30px; font-size: 0.75rem; font-weight: 500;
            letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.4s var(--ease-out-expo); opacity: 0; transform: translateX(-20px); pointer-events: none;
        }

        .arena-container.active .hub-back-trigger {
            opacity: 1; transform: translateX(0); pointer-events: auto;
        }

        .hub-back-trigger:hover {
            background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeUpCard {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .cards-grid { grid-template-columns: 1fr; gap: 20px; }
            .lobby-container { padding: 40px 20px; overflow-y: auto; height: 100vh; justify-content: flex-start; }
            body { align-items: flex-start; }
            .hero-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="lobby-container" id="lobbyContainer">
        
        <div class="hero-section">
            <h1 class="hero-title">Omni Board Studio</h1>
            <div class="hero-subtitle">Distributed P2P Neural Chess Platform</div>
        </div>

        <div class="cards-grid">
            
            <div class="game-card" onclick="enterArena('frame-cc')">
                <div class="card-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="8"></line><line x1="12" y1="16" x2="12" y2="22"></line><line x1="2" y1="12" x2="8" y2="12"></line><line x1="16" y1="12" x2="22" y2="12"></line></svg>
                </div>
                <div class="card-meta">
                    <div class="card-title">中国象棋</div>
                    <div class="card-desc">基于 WebRTC 直连技术的楚河汉界防御战。高度还原传统走法，支持实时局域网/广域网内网穿透与对抗。</div>
                </div>
                <div class="enter-action">
                    Initialize Link 
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </div>
            </div>

            <div class="game-card" onclick="enterArena('frame-go')">
                <div class="card-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                </div>
                <div class="card-meta">
                    <div class="card-title">围棋对决</div>
                    <div class="card-desc">19x19 星系坐标网络。采用高可用 MQTT 分布式消息队列，毫秒级同步，附带防自杀与自动化提子判定。</div>
                </div>
                <div class="enter-action">
                    Initialize Link 
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </div>
            </div>

            <div class="game-card" onclick="enterArena('frame-gomoku')">
                <div class="card-icon">
                    <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </div>
                <div class="card-meta">
                    <div class="card-title">五子棋局</div>
                    <div class="card-desc">纯粹的五子连珠战术博弈。内置启发式扫描 AI 引擎，提供实时的攻防威胁点与胜率高亮辅助。</div>
                </div>
                <div class="enter-action">
                    Initialize Link 
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </div>
            </div>

        </div>
    </div>

    <div class="arena-container" id="arenaContainer">
        <button class="hub-back-trigger" onclick="exitArena()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Terminal Hub
        </button>

        <iframe id="frame-go" class="game-frame" src="Go.html"></iframe>
        <iframe id="frame-gomoku" class="game-frame" src="Gomoku.html"></iframe>
    </div>

    <script>
        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });

        // Optimized Switch Engine with Canvas Pulse Synchronization
        function enterArena(frameId) {
            const lobby = document.getElementById('lobbyContainer');
            const arena = document.getElementById('arenaContainer');

            lobby.classList.add('hidden');

            document.querySelectorAll('.game-frame').forEach(f => f.classList.remove('active'));
            const targetFrame = document.getElementById(frameId);
            targetFrame.classList.add('active');

            setTimeout(() => {
                arena.classList.add('active');

                // CRITICAL SEED: Dispatches pulse events to force immediate Canvas view recalibration loops
                try {
                    if (targetFrame.contentWindow) {
                        targetFrame.contentWindow.dispatchEvent(new Event('resize'));
                        // Fallback trigger for custom chessboard canvas bundle draw functions
                        if (typeof targetFrame.contentWindow.drawBoard === 'function') {
                            targetFrame.contentWindow.drawBoard();
                        }
                    }
                } catch (e) {
                    console.log("[OmniEngine] Viewport dimensions synchronized.");
                }
            }, 300);
        }

        function exitArena() {
            const lobby = document.getElementById('lobbyContainer');
            const arena = document.getElementById('arenaContainer');

            arena.classList.remove('active');

            setTimeout(() => {
                lobby.classList.remove('hidden');
            }, 500);
        }
    </script>
</body>
</html>
