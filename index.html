<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Board Studio | Neural Arena</title>
    <style>
        :root {
            --bg: #050507;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #60a5fa;
            --text-primary: #ffffff;
            --text-secondary: #888899;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Lobby Layer */
        #lobby { padding: 80px 40px; max-width: 1200px; margin: 0 auto; width: 100%; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        #lobby.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }

        .header { margin-bottom: 60px; }
        .header h1 { font-size: 3rem; font-weight: 200; letter-spacing: -0.02em; margin-bottom: 10px; }
        .header p { color: var(--text-secondary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }

        /* Glass Cards */
        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent); background: rgba(255,255,255,0.06); transform: translateY(-10px); }
        .card-icon { font-size: 2.5rem; margin-bottom: 20px; }
        .card h2 { margin-bottom: 10px; font-weight: 400; }
        .card p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }

        /* Arena Layer */
        #arena { position: fixed; inset: 0; z-index: 10; opacity: 0; pointer-events: none; background: #000; display: flex; flex-direction: column; transition: 0.6s ease; }
        #arena.active { opacity: 1; pointer-events: auto; }

        .nav-bar { height: 70px; display: flex; align-items: center; padding: 0 40px; border-bottom: 1px solid var(--border); }
        .btn-back { cursor: pointer; color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.3s; }
        .btn-back:hover { color: #fff; }

        .iframe-container { flex: 1; position: relative; }
        .game-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; }
        .game-frame.active { display: block; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="header">
            <h1>Omni Studio</h1>
            <p>Select your tactical simulation interface</p>
        </div>
        <div class="grid">
            <div class="card" onclick="openGame('go.html', '围棋')">
                <div class="card-icon">⚫</div>
                <h2>围棋</h2>
                <p>19x19 territory mapping engine.</p>
            </div>
            <div class="card" onclick="openGame('gomoku.html', '五子棋')">
                <div class="card-icon">⚪</div>
                <h2>五子棋</h2>
                <p>Fast-response tactical line logic.</p>
            </div>
            <div class="card" onclick="openGame('Chess.html', '中国象棋')">
                <div class="card-icon">帥</div>
                <h2>中国象棋</h2>
                <p>Traditional river-divide combat.</p>
            </div>
        </div>
    </div>

    <div id="arena">
        <div class="nav-bar">
            <div class="btn-back" onclick="closeGame()">← BACK TO HUB</div>
        </div>
        <div class="iframe-container">
            <iframe id="gameFrame" class="game-frame"></iframe>
        </div>
    </div>

    <script>
        const lobby = document.getElementById('lobby');
        const arena = document.getElementById('arena');
        const gameFrame = document.getElementById('gameFrame');

        function openGame(url, title) {
            lobby.classList.add('hidden');
            setTimeout(() => {
                gameFrame.src = url;
                gameFrame.classList.add('active');
                arena.classList.add('active');
            }, 500);
        }

        function closeGame() {
            arena.classList.remove('active');
            setTimeout(() => {
                gameFrame.classList.remove('active');
                gameFrame.src = ''; // 释放内存
                lobby.classList.remove('hidden');
            }, 300);
        }
    </script>
</body>
</html>
