<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Omni Board Studio - Premium Hub</title>
    <style>
        :root {
            --bg-base: #030305;
            --bg-glow: #13131a;
            --glass-bg: rgba(20, 20, 25, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
       
        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% -30%, var(--bg-glow) 0%, transparent 75%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 60px 16px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
        }

        .game-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 32px;
            cursor: pointer;
            height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.2);
        }

        .card-icon { font-size: 2.8rem; margin-bottom: 12px; }
        .card-title { font-size: 1.25rem; margin-bottom: 8px; }

        /* ==================== Arena - 新移动端方案 ==================== */
        .arena-container {
            position: fixed;
            inset: 0;
            background: var(--bg-base);
            flex-direction: column;
            z-index: 9999;
            display: none;
        }
        .arena-container.active { display: flex; }

        .arena-navbar {
            min-height: 64px;
            background: rgba(9, 9, 13, 0.97);
            border-bottom: 1px solid #222;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .back-btn {
            padding: 10px 18px;
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .mobile-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 8px 16px;
            background: #1f1f25;
            border: 1px solid #444;
            color: #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .frame-wrapper {
            flex: 1;
            position: relative;
            background: #0a0a0a;
            overflow: auto;           /* 关键：允许滚动 */
            -webkit-overflow-scrolling: touch;
        }

        .game-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: none;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            min-width: 320px;
        }

        .arena-title {
            color: #888;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="matrix-grid" id="grid"></div>

    <div class="arena-container" id="arenaContainer">
        <div class="arena-navbar">
            <button class="back-btn" onclick="exitArena()">← 返回大厅</button>
            
            <div class="mobile-controls">
                <button class="control-btn" onclick="fitToScreen()">📱 适配屏幕</button>
                <button class="control-btn" onclick="toggleFullscreen()">⛶ 全屏</button>
            </div>

            <div class="arena-title" id="arenaTitleDisplay">TACTICAL MATRIX</div>
        </div>
        
        <div class="frame-wrapper" id="frameWrapper">
            <iframe id="frameInternationalChess" class="game-frame" data-src="Chess.html"></iframe>
            <iframe id="frameChineseChess" class="game-frame" data-src="chinese-chess.html"></iframe>
            <iframe id="frameMilitaryFlag" class="game-frame" data-src="military-flag.html"></iframe>
            <iframe id="frameNavalFlag" class="game-frame" data-src="naval-flag.html"></iframe>
            <iframe id="frameGo" class="game-frame" data-src="go.html"></iframe>
            <iframe id="frameGomoku" class="game-frame" data-src="gomoku.html"></iframe>
        </div>
    </div>

    <script>
        const games = [
            { id: "frameInternationalChess", title: "国际象棋", src: "Chess.html", icon: "♞" },
            { id: "frameChineseChess", title: "中国象棋", src: "chinese-chess.html", icon: "帥" },
            { id: "frameMilitaryFlag", title: "军棋", src: "military-flag.html", icon: "⚑" },
            { id: "frameNavalFlag", title: "航海棋", src: "naval-flag.html", icon: "⚓" },
            { id: "frameGo", title: "围棋", src: "go.html", icon: "⚫" },
            { id: "frameGomoku", title: "五子棋", src: "gomoku.html", icon: "⚪" }
        ];

        let currentFrame = null;

        function createCards() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div>
                        <div class="card-icon">${game.icon}</div>
                        <div class="card-title">${game.title}</div>
                    </div>
                    <div style="color:#aaa;font-size:0.9rem;">进入对局 →</div>
                `;
                card.onclick = () => enterArena(game.id, game.title, game.src);
                grid.appendChild(card);
            });
        }

        function enterArena(frameId, title, src) {
            document.getElementById('arenaTitleDisplay').textContent = title;
            document.getElementById('arenaContainer').classList.add('active');

            document.querySelectorAll('.game-frame').forEach(f => f.classList.remove('active'));

            currentFrame = document.getElementById(frameId);

            if (!currentFrame.src) {
                currentFrame.src = src;
            }

            currentFrame.classList.add('active');
            
            // 延迟一点执行适配
            setTimeout(() => {
                fitToScreen();
            }, 600);
        }

        function fitToScreen() {
            if (!currentFrame) return;
            
            const wrapper = document.getElementById('frameWrapper');
            
            // 重置样式，让浏览器自动适配
            currentFrame.style.width = 'auto';
            currentFrame.style.height = 'auto';
            
            // 等待iframe内容加载后再适配
            setTimeout(() => {
                const frameRect = currentFrame.getBoundingClientRect();
                const wrapperRect = wrapper.getBoundingClientRect();
                
                const scaleX = wrapperRect.width / frameRect.width * 0.95;
                const scaleY = wrapperRect.height / frameRect.height * 0.95;
                const scale = Math.min(scaleX, scaleY, 1.8);   // 限制最大放大倍数
                
                currentFrame.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }, 100);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function exitArena() {
            document.getElementById('arenaContainer').classList.remove('active');
            currentFrame = null;
        }

        // 初始化
        window.onload = createCards;
    </script>
</body>
</html>
