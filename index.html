<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Board Studio - Premium Hub</title>
    <style>
        :root {
            --bg-base: #030305;
            --bg-glow: #13131a;
            --glass-bg: rgba(20, 20, 25, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.18);
            --text-main: #f5f5f7;
            --text-dim: #888899;
            --accent: #ffffff;
            --accent-glow: #a0a0ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
       
        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% -30%, var(--bg-glow) 0%, transparent 75%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 60px 20px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
        }

        .game-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 34px 32px;
            cursor: pointer;
            backdrop-filter: blur(24px);
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--glass-border-hover);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
        }

        .card-icon { font-size: 2.6rem; margin-bottom: 16px; }
        .card-title { font-size: 1.28rem; margin-bottom: 8px; }
        .card-desc { font-size: 0.82rem; color: var(--text-dim); line-height: 1.5; }

        .arena-container {
            position: fixed;
            inset: 0;
            background: var(--bg-base);
            flex-direction: column;
            z-index: 9999;
            display: none;
        }
        .arena-container.active { display: flex; }

        .frame-wrapper { flex: 1; position: relative; background: #000; }
        .game-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        .game-frame.active { display: block; }

        .error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6666;
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 8px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="matrix-grid" id="grid"></div>

    <div class="arena-container" id="arenaContainer">
        <div style="height:60px;background:#09090d;display:flex;align-items:center;padding:0 28px;justify-content:space-between;border-bottom:1px solid #222;">
            <button onclick="exitArena()" style="padding:8px 18px;background:transparent;border:1px solid #444;color:#aaa;border-radius:8px;cursor:pointer;">← 返回大厅</button>
            <div id="arenaTitleDisplay" style="color:#888;font-size:0.95rem;letter-spacing:1px;">TACTICAL MATRIX</div>
        </div>
        
        <div class="frame-wrapper">
            <div class="error-msg" id="errorMsg"></div>
            
            <iframe id="frameInternationalChess" class="game-frame" data-src="Chess.html"></iframe>
            <iframe id="frameChineseChess" class="game-frame" data-src="chinese-chess.html"></iframe>
            <iframe id="frameMilitaryFlag" class="game-frame" data-src="military-flag.html"></iframe>
            <iframe id="frameNavalFlag" class="game-frame" data-src="naval-flag.html"></iframe>
            <iframe id="frameGo" class="game-frame" data-src="go.html"></iframe>
            <iframe id="frameGomoku" class="game-frame" data-src="gomoku.html"></iframe>
        </div>
    </div>

    <script>
        const games = [
            { id: "frameInternationalChess", title: "国际象棋", src: "Chess.html", icon: "♞" },
            { id: "frameChineseChess", title: "中国象棋", src: "chinese-chess.html", icon: "帥" },
            { id: "frameMilitaryFlag", title: "军棋", src: "military-flag.html", icon: "⚑" },
            { id: "frameNavalFlag", title: "航海棋", src: "naval-flag.html", icon: "⚓" },
            { id: "frameGo", title: "围棋", src: "go.html", icon: "⚫" },
            { id: "frameGomoku", title: "五子棋", src: "gomoku.html", icon: "⚪" }
        ];

        function createCards() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div>
                        <div class="card-icon">${game.icon}</div>
                        <div class="card-title">${game.title}</div>
                        <div class="card-desc">点击进入对局</div>
                    </div>
                    <div style="color:#aaa;font-size:0.8rem;">ENTER →</div>
                `;
                card.onclick = () => enterArena(game.id, game.title, game.src);
                grid.appendChild(card);
            });
        }

        function enterArena(frameId, title, src) {
            document.getElementById('arenaTitleDisplay').textContent = title;
            document.getElementById('arenaContainer').classList.add('active');

            // 隐藏所有frame
            document.querySelectorAll('.game-frame').forEach(f => f.classList.remove('active'));

            const frame = document.getElementById(frameId);
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            // 设置src并显示
            if (!frame.src || frame.src.endsWith('/')) {
                frame.src = src;
            }
            frame.classList.add('active');

            // 错误监控
            frame.onload = () => {
                console.log(`✅ ${title} 加载成功`);
            };

            frame.onerror = () => {
                errorMsg.textContent = `❌ 无法加载 ${title}，请检查文件是否存在`;
                errorMsg.style.display = 'block';
                console.error(`加载失败: ${src}`);
            };
        }

        function exitArena() {
            document.getElementById('arenaContainer').classList.remove('active');
        }

        // 初始化
        window.onload = createCards;
    </script>
</body>
</html>
