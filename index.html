<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Omni Board Studio - Premium Hub</title>
    <style>
        :root {
            --bg-base: #030305;
            --bg-glow: #13131a;
            --glass-bg: rgba(20, 20, 25, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.18);
            --text-main: #f5f5f7;
            --text-dim: #888899;
            --accent: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
       
        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% -30%, var(--bg-glow) 0%, transparent 75%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 60px 20px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
        }

        .game-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 34px 32px;
            cursor: pointer;
            backdrop-filter: blur(24px);
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--glass-border-hover);
        }

        .card-icon { font-size: 2.6rem; margin-bottom: 16px; }
        .card-title { font-size: 1.28rem; margin-bottom: 8px; }

        /* ==================== Arena ==================== */
        .arena-container {
            position: fixed;
            inset: 0;
            background: var(--bg-base);
            flex-direction: column;
            z-index: 9999;
            display: none;
        }
        .arena-container.active { display: flex; }

        .arena-navbar {
            height: 68px;
            background: rgba(9, 9, 13, 0.96);
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-btn {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* 缩放控制条 */
        .zoom-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            background: #222;
            border: none;
            color: white;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-slider {
            width: 180px;
        }

        .zoom-value {
            font-size: 0.85rem;
            color: #aaa;
            min-width: 48px;
            text-align: center;
        }

        .frame-wrapper {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .game-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            transform-origin: center top;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="matrix-grid" id="grid"></div>

    <div class="arena-container" id="arenaContainer">
        <div class="arena-navbar">
            <button class="back-btn" onclick="exitArena()">← 返回大厅</button>
            
            <div class="zoom-control">
                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <input type="range" class="zoom-slider" id="zoomSlider" min="50" max="250" value="100" oninput="applyZoom()">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <div class="zoom-value" id="zoomValue">100%</div>
                <button class="zoom-btn" onclick="resetZoom()" style="font-size:0.8rem;">Reset</button>
            </div>

            <div id="arenaTitleDisplay" style="color:#888;font-size:0.95rem;letter-spacing:1px;">TACTICAL MATRIX</div>
        </div>
        
        <div class="frame-wrapper">
            <iframe id="frameInternationalChess" class="game-frame" data-src="Chess.html"></iframe>
            <iframe id="frameChineseChess" class="game-frame" data-src="chinese-chess.html"></iframe>
            <iframe id="frameMilitaryFlag" class="game-frame" data-src="military-flag.html"></iframe>
            <iframe id="frameNavalFlag" class="game-frame" data-src="naval-flag.html"></iframe>
            <iframe id="frameGo" class="game-frame" data-src="go.html"></iframe>
            <iframe id="frameGomoku" class="game-frame" data-src="gomoku.html"></iframe>
        </div>
    </div>

    <script>
        let currentZoom = 100;
        let currentFrame = null;

        const games = [
            { id: "frameInternationalChess", title: "国际象棋", src: "Chess.html", icon: "♞" },
            { id: "frameChineseChess", title: "中国象棋", src: "chinese-chess.html", icon: "帥" },
            { id: "frameMilitaryFlag", title: "军棋", src: "military-flag.html", icon: "⚑" },
            { id: "frameNavalFlag", title: "航海棋", src: "naval-flag.html", icon: "⚓" },
            { id: "frameGo", title: "围棋", src: "go.html", icon: "⚫" },
            { id: "frameGomoku", title: "五子棋", src: "gomoku.html", icon: "⚪" }
        ];

        function createCards() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div>
                        <div class="card-icon">${game.icon}</div>
                        <div class="card-title">${game.title}</div>
                    </div>
                    <div style="color:#aaa;font-size:0.85rem;">ENTER →</div>
                `;
                card.onclick = () => enterArena(game.id, game.title, game.src);
                grid.appendChild(card);
            });
        }

        function enterArena(frameId, title, src) {
            document.getElementById('arenaTitleDisplay').textContent = title;
            document.getElementById('arenaContainer').classList.add('active');

            // 隐藏所有iframe
            document.querySelectorAll('.game-frame').forEach(f => f.classList.remove('active'));

            currentFrame = document.getElementById(frameId);
            currentZoom = 100;

            if (!currentFrame.src || currentFrame.src.endsWith('/')) {
                currentFrame.src = src;
            }

            currentFrame.classList.add('active');
            resetZoom();
        }

        function applyZoom() {
            if (!currentFrame) return;
            currentZoom = parseInt(document.getElementById('zoomSlider').value);
            currentFrame.style.transform = `scale(${currentZoom / 100})`;
            document.getElementById('zoomValue').textContent = currentZoom + '%';
        }

        function zoomIn() {
            let slider = document.getElementById('zoomSlider');
            slider.value = Math.min(250, parseInt(slider.value) + 10);
            applyZoom();
        }

        function zoomOut() {
            let slider = document.getElementById('zoomSlider');
            slider.value = Math.max(50, parseInt(slider.value) - 10);
            applyZoom();
        }

        function resetZoom() {
            document.getElementById('zoomSlider').value = 100;
            applyZoom();
        }

        function exitArena() {
            document.getElementById('arenaContainer').classList.remove('active');
            currentFrame = null;
        }

        // 初始化
        window.onload = createCards;
    </script>
</body>
</html>
