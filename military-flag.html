<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Military Chess - Masterpiece Pro (Archive Exchange Suite)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #141418;
            --surface-sub: #1e1e24;
            --border: #2c2c35;
            --text-main: #f0f0f0;
            --text-dim: #888899;
            --red-piece: #ff4d4d;
            --black-piece: #ffffff;
            --board-line: #444455;
            --railroad-line: #8a50ff;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --cell-w: 76px; 
            --cell-h: 56px;
            --board-pad: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { display: flex; gap: 40px; max-width: 1400px; width: 100%; align-items: flex-start; justify-content: center; }
        .sidebar { flex: 0 0 350px; width: 350px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        
        h1 { font-size: 1.25rem; font-weight: 400; letter-spacing: -0.02em; display: flex; justify-content: space-between; align-items: center; }
        .label-tiny { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 8px; }
        .panel-section { border-top: 1px solid var(--border); padding-top: 20px; }
        
        .peer-id-display { font-family: monospace; font-size: 1.05rem; color: #fff; font-weight: 500; background: var(--surface-sub); padding: 12px; border-radius: 8px; border: 1px solid var(--border); text-align: center; word-break: break-all; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: var(--surface-sub); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: var(--text-dim); }

        .btn { background: var(--text-main); color: var(--bg); border: none; padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.2s, transform 0.1s; text-align: center; }
        .btn:hover { background: #fff; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--surface-sub); border-color: var(--text-dim); }

        .status-area { display: flex; flex-direction: column; gap: 8px; }
        .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--surface-sub); color: var(--text-dim); display: inline-block; width: fit-content; }
        .status-badge.connected { background: #12281a; color: #40c057; border: 1px solid #1b4b2c; }
        .status-badge.spectator-mode { background: #2b1a12; color: #fd7e14; border: 1px solid #4b2c1b; }
        .status-badge.your-turn { background: #1a233a; color: #4dabf7; border: 1px solid #1e3a67; animation: pulseTurn 2s infinite linear; }
        @keyframes pulseTurn { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
        .stat-card { background: var(--surface-sub); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .stat-val { font-size: 1.2rem; font-weight: 500; margin-top: 4px; color: #fff; }
        .log-box { height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; color: var(--text-dim); line-height: 1.6; background: #0c0c0e; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }

        .board-wrapper {
            position: relative;
            background: #111115;
            padding: var(--board-pad);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid var(--border);
        }

        .svg-layer { position: absolute; top: var(--board-pad); left: var(--board-pad); pointer-events: none; z-index: 1; }
        .trajectory-layer { position: absolute; top: var(--board-pad); left: var(--board-pad); pointer-events: none; z-index: 2; width: calc(4 * var(--cell-w)); height: calc(11 * var(--cell-h)); }
        
        .military-board { 
            position: relative; 
            display: grid; 
            grid-template-columns: repeat(5, var(--cell-w)); 
            grid-template-rows: repeat(12, var(--cell-h)); 
            z-index: 5; 
            width: calc(4 * var(--cell-w));
            height: calc(11 * var(--cell-h));
        }
        
        .cell { 
            position: absolute; 
            width: var(--cell-w); 
            height: var(--cell-h); 
            transform: translate(-50%, -50%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 10;
        }

        .piece {
            width: 62px; height: 42px; border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s var(--ease), box-shadow 0.2s, top 0.3s var(--ease), left 0.3s var(--ease);
            user-select: none; z-index: 20; position: absolute;
            transform: translate(-50%, -50%);
        }
        .piece:hover { transform: translate(-50%, -52%) scale(1.04); box-shadow: 0 6px 14px rgba(0,0,0,0.4); }
        .piece.selected { border-color: #fff !important; box-shadow: 0 0 12px rgba(255,255,255,0.4) !important; transform: translate(-50%, -54%) scale(1.06); z-index: 30; }

        .piece.red { background: var(--red-piece); color: #000; }
        .piece.black { background: var(--black-piece); color: #000; }

        /* 联机模式下的对方暗棋隐藏样式 */
        .piece.fog-hidden {
            background: linear-gradient(135deg, #22222a, #18181f) !important;
            color: rgba(255,255,255,0.2) !important;
            border: 1px solid #3c3c45 !important;
        }

        .camp-node { width: 54px; height: 34px; border-radius: 50%; border: 1.5px dashed var(--board-line); background: #111115; position: absolute; transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }
        .hq-node { width: 66px; height: 44px; border: 1.5px solid var(--board-line); background: #16161c; position: absolute; transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }

        .cell.highlight::before {
            content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--text-main); opacity: 0.4; z-index: 15; pointer-events: none;
        }

        .celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5,5,8,0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.5s var(--ease);
        }
        .celebration-overlay.active { opacity: 1; pointer-events: auto; }
        .celebration-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px 64px; text-align: center; box-shadow: 0 30px 70px rgba(0,0,0,0.5);
        }
        .celebration-title { font-size: 2rem; font-weight: 300; margin-bottom: 8px; color: #fff; }
        .celebration-subtitle { font-size: 0.95rem; color: var(--text-dim); margin-bottom: 24px; }

        .replay-banner { background: #2b1a12; color: #fd7e14; border: 1px solid #4b2c1b; border-radius: 8px; padding: 12px; font-size: 0.9rem; margin-bottom: 16px; display: none; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="celebrationOverlay" class="celebration-overlay">
        <div class="celebration-card">
            <div id="celebrationTitle" class="celebration-title">红方获胜</div>
            <div id="celebrationSubtitle" class="celebration-subtitle">对方军旗已被斩落</div>
            <button class="btn" onclick="document.getElementById('celebrationOverlay').classList.remove('active')">查看战场</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h1>P2P Military Chess</h1>
            
            <div id="replayBanner" class="replay-banner">
                <span>复盘模式中</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="replayPrev()">◀</button>
                    <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="replayNext()">▶</button>
                </div>
            </div>

            <div class="panel-section" style="border:none; padding:0;">
                <span class="label-tiny">棋局密钥</span>
                <div class="peer-id-display" id="myIdDisplay">Generating...</div>
                <button class="btn btn-secondary" style="margin-top: 8px; width: 100%;" onclick="copyRoomKey()">复制我的密钥</button>
            </div>

            <div class="panel-section">
                <span class="label-tiny">连接敌军</span>
                <div class="input-group">
                    <input type="text" id="peerIdInput" placeholder="粘贴对方的密钥...">
                    <button class="btn" onclick="connectToPeer()">对阵</button>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">战场雷达</span>
                <div class="status-area">
                    <div id="connectionStatus" class="status-badge">单机对策模式</div>
                    <div id="roleStatus" class="status-badge" style="display:none;"></div>
                    <div id="turnStatus" class="status-badge">当前回合: 红方</div>
                </div>
            </div>

            <div class="panel-section">
                <span class="label-tiny">战绩</span>
                <div class="stats-grid">
                    <div class="stat-card"><span class="label-tiny">胜</span><div class="stat-val" id="statWins">0</div></div>
                    <div class="stat-card"><span class="label-tiny">负</span><div class="stat-val" id="statLosses">0</div></div>
                    <div class="stat-card"><span class="label-tiny">胜率</span><div class="stat-val" id="statRate">0%</div></div>
                </div>
            </div>

            <div class="panel-section" style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                <span class="label-tiny">情报日志</span>
                <div class="log-box" id="logBox"></div>
                <div style="display:flex; gap:8px; margin-top:4px;">
                    <button class="btn btn-secondary" style="flex:1; padding:6px; font-size:0.8rem;" onclick="exportArchive()">导出复盘谱</button>
                    <button class="btn btn-secondary" style="flex:1; padding:6px; font-size:0.8rem;" onclick="initBoard()">重摆棋局</button>
                </div>
            </div>
        </div>

        <div class="board-wrapper" id="boardWrapper">
            <svg class="trajectory-layer" id="trajectoryLayer"></svg>
            <div class="military-board" id="board"></div>
        </div>
    </div>

    <script>
        const ROWS = 12;
        const COLS = 5;
        const CS_W = 76;
        const CS_H = 56;

        let pieces = [];
        let selectedPiece = null;
        let currentTurn = 'red';
        let myRole = null; // 'red', 'black', 'spectator', null
        let gameActive = true;
        let lastMove = null;

        // 归档记录复盘数组
        let replayStates = [];
        let currentReplayStep = 0;
        let isReplayMode = false;

        const PIECE_TYPES = [
            { name: "司令", power: 9 }, { name: "军长", power: 8 },
            { name: "师长", power: 7 }, { name: "师长", power: 7 },
            { name: "旅长", power: 6 }, { name: "旅长", power: 6 },
            { name: "团长", power: 5 }, { name: "团长", power: 5 },
            { name: "营长", power: 4 }, { name: "营长", power: 4 },
            { name: "连长", power: 3 }, { name: "连长", power: 3 }, { name: "连长", power: 3 },
            { name: "排长", power: 2 }, { name: "排长", power: 2 }, { name: "排长", power: 2 },
            { name: "工兵", power: 1 }, { name: "工兵", power: 1 }, { name: "工兵", power: 1 },
            { name: "炸弹", power: 0 }, { name: "炸弹", power: 0 },
            { name: "地雷", power: -1 }, { name: "地雷", power: -1 }, { name: "地雷", power: -1 },
            { name: "军旗", power: -2 }
        ];

        const CAMP_NODES = [
            {r:2, c:1}, {r:2, c:3}, {r:3, c:2}, {r:4, c:1}, {r:4, c:3},
            {r:7, c:1}, {r:7, c:3}, {r:8, c:2}, {r:9, c:1}, {r:9, c:3}
        ];
        const HQ_NODES = [
            {r:11, c:1}, {r:11, c:3}, 
            {r:0, c:1}, {r:0, c:3}
        ];

        let mqttClient = null;
        let currentRoomTopic = '';
        const myUniqueId = 'MIL_' + Math.random().toString(36).substr(2, 9);
        let myRoomId = '';
        let matchStats = JSON.parse(localStorage.getItem('military_stats_v1')) || { wins: 0, losses: 0 };

        function isCamp(r, c) { return CAMP_NODES.some(n => n.r === r && n.c === c); }
        function isHQ(r, c) { return HQ_NODES.some(n => n.r === r && n.c === c); }
        function isRailroad(r, c) {
            if (r === 1 || r === 5 || r === 6 || r === 10) return true;
            if ((r >= 1 && r <= 10) && (c === 0 || c === 4)) return true;
            return false;
        }

        function renderSVGBoard() {
            const w = (COLS - 1) * CS_W;
            const h = (ROWS - 1) * CS_H;
            let svg = `<svg class="svg-layer" width="${w+40}" height="${h+40}" viewBox="-20 -20 ${w+40} ${h+40}" xmlns="http://www.w3.org/2000/svg">`;
            
            for(let r=0; r<ROWS; r++){
                svg += `<line x1="0" y1="${r*CS_H}" x2="${w}" y2="${r*CS_H}" stroke="${isRailroad(r,0)?'var(--railroad-line)':'var(--board-line)'}" stroke-width="${isRailroad(r,0)?2:1}"/>`;
            }
            for(let c=0; c<COLS; c++){
                svg += `<line x1="${c*CS_W}" y1="0" x2="${c*CS_W}" y2="${5*CS_H}" stroke="${isRailroad(1,c)?'var(--railroad-line)':'var(--board-line)'}" stroke-width="1.5"/>`;
                svg += `<line x1="${c*CS_W}" y1="${6*CS_H}" x2="${c*CS_W}" y2="${11*CS_H}" stroke="${isRailroad(6,c)?'var(--railroad-line)':'var(--board-line)'}" stroke-width="1.5"/>`;
            }
            svg += `<line x1="0" y1="${5*CS_H}" x2="0" y2="${6*CS_H}" stroke="var(--railroad-line)" stroke-width="2"/>`;
            svg += `<line x1="${w}" y1="${5*CS_H}" x2="${w}" y2="${6*CS_H}" stroke="var(--railroad-line)" stroke-width="2"/>`;
            svg += `<line x1="${2*CS_W}" y1="${5*CS_H}" x2="${2*CS_W}" y2="${6*CS_H}" stroke="var(--board-line)" stroke-dasharray="4" stroke-width="1.5"/>`;

            const slashes = [
                {r1:1,c1:0,r2:3,c2:2}, {r1:1,c1:4,r2:3,c2:2}, {r1:3,c1:2,r2:5,c2:0}, {r1:3,c1:2,r2:5,c2:4},
                {r1:1,c1:2,r2:2,c1:1}, {r1:1,c1:2,r2:2,c2:3}, {r1:2,c1:1,r2:3,c2:2}, {r1:2,c1:3,r2:3,c2:2},
                {r1:3,c1:2,r2:4,c1:1}, {r1:3,c1:2,r2:4,c2:3}, {r1:4,c1:1,r2:5,c2:2}, {r1:4,c1:3,r2:5,c2:2},
                {r1:6,c1:2,r2:7,c1:1}, {r1:6,c1:2,r2:7,c2:3}, {r1:7,c1:1,r2:8,c2:2}, {r1:7,c1:3,r2:8,c2:2},
                {r1:8,c1:2,r2:9,c1:1}, {r1:8,c1:2,r2:9,c2:3}, {r1:9,c1:1,r2:10,c2:2}, {r1:9,c1:3,r2:10,c2:2},
                {r1:6,c1:0,r2:8,c2:2}, {r1:6,c1:4,r2:8,c2:2}, {r1:8,c1:2,r2:10,c2:0}, {r1:8,c1:2,r2:10,c2:4}
            ];
            slashes.forEach(s => {
                svg += `<line x1="${s.c1*CS_W}" y1="${s.r1*CS_H}" x2="${s.c2*CS_W}" y2="${s.r2*CS_H}" stroke="var(--board-line)" stroke-width="1"/>`;
            });

            svg += `</svg>`;
            const oldSvg = document.querySelector('.svg-layer');
            if (oldSvg) oldSvg.remove();
            document.getElementById('boardWrapper').insertAdjacentHTML('afterbegin', svg);
        }

        function createDOMGrid() {
            const boardDOM = document.getElementById('board');
            boardDOM.innerHTML = '';
            
            CAMP_NODES.forEach(n => {
                const camp = document.createElement('div'); camp.className = 'camp-node';
                camp.style.left = `${n.c * CS_W}px`; camp.style.top = `${n.r * CS_H}px`;
                boardDOM.appendChild(camp);
            });
            HQ_NODES.forEach(n => {
                const hq = document.createElement('div'); hq.className = 'hq-node';
                hq.style.left = `${n.c * CS_W}px`; hq.style.top = `${n.r * CS_H}px`;
                boardDOM.appendChild(hq);
            });

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.left = `${c * CS_W}px`; cell.style.top = `${r * CS_H}px`;
                    cell.dataset.row = r; cell.dataset.col = c;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardDOM.appendChild(cell);
                }
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function initBoard() {
            pieces = [];
            selectedPiece = null;
            currentTurn = 'red';
            gameActive = true;
            lastMove = null;
            document.getElementById('trajectoryLayer').innerHTML = '';

            let redPool = JSON.parse(JSON.stringify(PIECE_TYPES));
            let blackPool = JSON.parse(JSON.stringify(PIECE_TYPES));
            shuffleArray(redPool); shuffleArray(blackPool);

            let redIdx = 0, blackIdx = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (isCamp(r, c)) continue;
                    if (r < 6) {
                        let t = blackPool[blackIdx++];
                        pieces.push({ id: 'b_' + blackIdx, side: 'black', name: t.name, power: t.power, r: r, c: c });
                    } else {
                        let t = redPool[redIdx++];
                        pieces.push({ id: 'r_' + redIdx, side: 'red', name: t.name, power: t.power, r: r, c: c });
                    }
                }
            }

            replayStates = [];
            recordReplayState();

            renderPieces();
            updateTurnUI();
            clearHighlights();
        }

        function renderPieces() {
            // 用数据驱动模式同步实体，不销毁重构，保留原本UI的过渡动画效果
            const boardDOM = document.getElementById('board');
            let pieceElements = boardDOM.querySelectorAll('.piece');
            let currentIds = pieces.map(p => p.id);

            pieceElements.forEach(el => {
                if (!currentIds.includes(el.id)) el.remove();
            });

            pieces.forEach(p => {
                let pDOM = document.getElementById(p.id);
                if (!pDOM) {
                    pDOM = document.createElement('div');
                    pDOM.id = p.id;
                    pDOM.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleCellClick(p.r, p.c);
                    });
                    boardDOM.appendChild(pDOM);
                }

                pDOM.style.left = `${p.c * CS_W}px`;
                pDOM.style.top = `${p.r * CS_H}px`;

                // 【核心修改】当处于联机模式（myRole不为空）且不是复盘模式时，隐藏非己方的棋子信息
                if (myRole !== null && myRole !== 'spectator' && p.side !== myRole && !isReplayMode) {
                    pDOM.className = `piece ${p.side} fog-hidden`;
                    pDOM.innerText = "棋子"; // 模糊显示为无区分状态
                } else {
                    pDOM.className = `piece ${p.side}`;
                    pDOM.innerText = p.name;
                }

                if (selectedPiece && selectedPiece.id === p.id) {
                    pDOM.classList.add('selected');
                }
            });
        }

        function handleCellClick(r, c) {
            if (!gameActive || isReplayMode) return;
            if (myRole !== null && myRole !== 'spectator' && currentTurn !== myRole) return;

            const clickTargetPiece = pieces.find(p => p.r === r && p.c === c);

            if (selectedPiece) {
                if (clickTargetPiece && clickTargetPiece.side === selectedPiece.side) {
                    if (myRole !== null && myRole !== 'spectator' && selectedPiece.side !== myRole) return;
                    selectedPiece = clickTargetPiece;
                    highlightValidMoves(selectedPiece);
                    renderPieces();
                } else {
                    if (validateMove(selectedPiece, r, c)) {
                        executeMoveAction(selectedPiece, r, c);
                    } else {
                        selectedPiece = null;
                        clearHighlights();
                        renderPieces();
                    }
                }
            } else {
                if (clickTargetPiece && clickTargetPiece.side === currentTurn) {
                    if (myRole !== null && myRole !== 'spectator' && clickTargetPiece.side !== myRole) return;
                    selectedPiece = clickTargetPiece;
                    highlightValidMoves(selectedPiece);
                    renderPieces();
                }
            }
        }

        function highlightValidMoves(piece) {
            clearHighlights();
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (validateMove(piece, r, c)) {
                        const cell = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
                        if (cell) cell.classList.add('highlight');
                    }
                }
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.cell').forEach(el => el.classList.remove('highlight'));
        }

        function validateMove(piece, tr, tc) {
            const dr = Math.abs(tr - piece.r);
            const dc = Math.abs(tc - piece.c);
            
            if (piece.power === -1 || piece.power === -2) return false;
            if (isCamp(tr, tc)) {
                if (pieces.some(p => p.r === tr && p.c === tc)) return false;
            }

            const isNeighbor = (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
            let isCampSlash = false;
            if (isCamp(piece.r, piece.c) || isCamp(tr, tc)) {
                if (dr === 1 && dc === 1) isCampSlash = true;
            }

            let isRailMove = false;
            if (isRailroad(piece.r, piece.c) && isRailroad(tr, tc)) {
                if (piece.r === tr) {
                    let step = tc > piece.c ? 1 : -1; let blocked = false;
                    for (let c = piece.c + step; c !== tc; c += step) {
                        if (pieces.some(p => p.r === tr && p.c === c)) blocked = true;
                    }
                    if (!blocked) isRailMove = true;
                } else if (piece.c === tc) {
                    let step = tr > piece.r ? 1 : -1; let blocked = false;
                    for (let r = piece.r + step; r !== tr; r += step) {
                        if (piece.r < 6 && tr >= 6 && (piece.c !== 0 && piece.c !== 4) && (r === 5 || r === 6)) blocked = true;
                        if (pieces.some(p => p.r === r && p.c === tc)) blocked = true;
                    }
                    if (!blocked) isRailMove = true;
                }
            }

            return isNeighbor || isCampSlash || isRailMove;
        }

        function executeMoveAction(piece, tr, tc) {
            if (myRole !== null && myRole !== 'spectator' && currentTurn === myRole) {
                sendMqttMessage('move', { pieceId: piece.id, fromR: piece.r, fromC: piece.c, toR: tr, toC: tc });
            }

            const fromR = piece.r; const fromC = piece.c;
            const targetIndex = pieces.findIndex(p => p.r === tr && p.c === tc);
            
            // 【核心删除】删除了此处的走棋细则、坐标、棋子名称的公共 log() 日志输出，保证不露白
            if (targetIndex !== -1) {
                const target = pieces[targetIndex];
                
                if (target.power === -2) {
                    pieces.splice(targetIndex, 1);
                    piece.r = tr; piece.c = tc;
                    triggerMatchEnd(piece.side, `突破行营斩落军旗`);
                    return;
                }
                
                if (piece.power === 0 || target.power === 0) {
                    pieces = pieces.filter(p => p.id !== piece.id && p.id !== target.id);
                } else if (target.power === -1) {
                    if (piece.power === 1) {
                        pieces.splice(targetIndex, 1); piece.r = tr; piece.c = tc;
                    } else {
                        pieces = pieces.filter(p => p.id !== piece.id && p.id !== target.id);
                    }
                } else {
                    if (piece.power > target.power) {
                        pieces.splice(targetIndex, 1); piece.r = tr; piece.c = tc;
                    } else if (piece.power === target.power) {
                        pieces = pieces.filter(p => p.id !== piece.id && p.id !== target.id);
                    } else {
                        pieces = pieces.filter(p => p.id !== piece.id);
                    }
                }
            } else {
                piece.r = tr; piece.c = tc;
            }

            lastMove = { from: { r: fromR, c: fromC }, to: { r: tr, c: tc } };
            drawTrajectory(fromR, fromC, tr, tc);

            selectedPiece = null;
            clearHighlights();
            checkGameVitality();

            if (gameActive) {
                currentTurn = currentTurn === 'red' ? 'black' : 'red';
                updateTurnUI();
            }
            recordReplayState();
            renderPieces();
            playMoveSound();
        }

        function drawTrajectory(fr, fc, tr, tc) {
            const layer = document.getElementById('trajectoryLayer');
            layer.innerHTML = `
                <line x1="${fc*CS_W}" y1="${fr*CS_H}" x2="${tc*CS_W}" y2="${tr*CS_H}" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4"/>
                <circle cx="${tc*CS_W}" cy="${tr*CS_H}" r="4" fill="rgba(255,255,255,0.4)"/>
            `;
        }

        function checkGameVitality() {
            const redHasFlag = pieces.some(p => p.side === 'red' && p.power === -2);
            const blackHasFlag = pieces.some(p => p.side === 'black' && p.power === -2);

            if (!redHasFlag) { triggerMatchEnd('black', "红方军旗失守"); return; }
            if (!blackHasFlag) { triggerMatchEnd('red', "黑方军旗失守"); return; }

            const redMovable = pieces.some(p => p.side === 'red' && p.power > 0);
            const blackMovable = pieces.some(p => p.side === 'black' && p.power > 0);

            if (!redMovable) triggerMatchEnd('black', "红方无可用兵力");
            else if (!blackMovable) triggerMatchEnd('red', "黑方无可用兵力");
        }

        function triggerMatchEnd(winner, summary) {
            gameActive = false;
            document.getElementById('celebrationTitle').innerText = `${winner === 'red' ? '红方' : '黑方'} 获得胜利`;
            document.getElementById('celebrationSubtitle').innerText = summary;
            
            if (myRole !== null && myRole !== 'spectator') {
                if (winner === myRole) { matchStats.wins++; log(`[系统] 战斗结束，我军胜出。`); } 
                else { matchStats.losses++; log(`[系统] 战斗结束，我军落败。`); }
                localStorage.setItem('military_stats_v1', JSON.stringify(matchStats));
                updateStatsUI();
            } else {
                log(`[系统] 胜负已分，${winner === 'red' ? '红方' : '黑方'}获胜。`);
            }

            document.getElementById('celebrationOverlay').classList.add('active');
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function playMoveSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } catch(e){}
        }

        // ==================== 复盘控制存取架构 ====================
        function recordReplayState() {
            replayStates.push({
                pieces: JSON.parse(JSON.stringify(pieces)),
                turn: currentTurn,
                lastMove: JSON.parse(JSON.stringify(lastMove))
            });
            currentReplayStep = replayStates.length - 1;
        }

        function initReplayMode() {
            isReplayMode = true; gameActive = false;
            document.getElementById('replayBanner').style.display = 'flex';
            applyReplayState(0);
        }

        function applyReplayState(index) {
            currentReplayStep = index;
            const state = replayStates[index];
            pieces = JSON.parse(JSON.stringify(state.pieces));
            currentTurn = state.turn; lastMove = state.lastMove;
            
            clearHighlights();
            renderPieces();
            if (lastMove && lastMove.from && lastMove.from.r !== null) {
                drawTrajectory(lastMove.from.r, lastMove.from.c, lastMove.to.r, lastMove.to.c);
            } else {
                document.getElementById('trajectoryLayer').innerHTML = '';
            }
            updateTurnUI();
        }

        function replayPrev() { if (currentReplayStep > 0) applyReplayState(currentReplayStep - 1); }
        function replayNext() { if (currentReplayStep < replayStates.length - 1) applyReplayState(currentReplayStep + 1); }

        function exportArchive() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(replayStates));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Military_Chess_Archive_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
        }

        // ==================== P2P 信道交互网关 ====================
        function initNetwork() {
            myRoomId = 'MIL-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('myIdDisplay').innerText = myRoomId;
            currentRoomTopic = `military/room/${myRoomId}`;

            log("战局网络初始化就绪。");
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                mqttClient.subscribe(currentRoomTopic);
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.senderId === myUniqueId) return;
                    handleNetworkData(data);
                } catch (e) { console.error(e); }
            });
        }

        function connectToPeer() {
            const remoteId = document.getElementById('peerIdInput').value.trim();
            if (!remoteId) return;
            mqttClient.unsubscribe(currentRoomTopic);
            currentRoomTopic = `military/room/${remoteId}`;
            mqttClient.subscribe(currentRoomTopic);

            myRole = 'black';
            sendMqttMessage('join');
        }

        function sendMqttMessage(type, extra = {}) {
            if (!mqttClient) return;
            mqttClient.publish(currentRoomTopic, JSON.stringify({ type: type, senderId: myUniqueId, ...extra }));
        }

        function handleNetworkData(data) {
            if (data.type === 'join') {
                myRole = 'red';
                updateConnectionUI(true);
                initBoard();
                log("系统提示：敌军已切入战场，暗棋隐藏模式已启动。");
                sendMqttMessage('sync_board', { initPieces: pieces });
            } else if (data.type === 'sync_board') {
                pieces = data.initPieces;
                updateConnectionUI(true);
                replayStates = []; recordReplayState();
                renderPieces();
                log("系统提示：成功接入战场，暗棋隐藏模式已启动。");
            } else if (data.type === 'move') {
                const syncPiece = pieces.find(p => p.id === data.pieceId);
                if (syncPiece) executeMoveAction(syncPiece, data.toR, data.toC);
            }
        }

        function updateTurnUI() {
            const turnBadge = document.getElementById('turnStatus');
            if (!gameActive) { turnBadge.innerText = "战斗结束"; return; }
            const name = currentTurn === 'red' ? '红方' : '黑方'; turnBadge.innerText = `当前回合: ${name}`;
            if (myRole !== null && myRole !== 'spectator' && currentTurn === myRole) { 
                turnBadge.className = "status-badge your-turn"; turnBadge.innerText += " (到你了)"; 
            } else { 
                turnBadge.className = "status-badge"; 
            }
        }

        function updateConnectionUI(isConnected) {
            const badge = document.getElementById('connectionStatus'); const rBadge = document.getElementById('roleStatus');
            if (isConnected) {
                badge.innerText = "网络暗棋对阵中"; badge.className = "status-badge connected";
                rBadge.style.display = "inline-block"; rBadge.innerText = myRole === 'red' ? "红方主帅" : "黑方主帅";
            }
            updateTurnUI();
        }

        function updateStatsUI() {
            document.getElementById('statWins').innerText = matchStats.wins;
            document.getElementById('statLosses').innerText = matchStats.losses;
            const total = matchStats.wins + matchStats.losses;
            document.getElementById('statRate').innerText = total === 0 ? "0%" : `${Math.round((matchStats.wins / total) * 100)}%`;
        }

        function copyRoomKey() {
            const id = document.getElementById('myIdDisplay').innerText;
            if(!id.includes("Generating")) navigator.clipboard.writeText(id).then(() => log("密钥已复制到剪贴板。"));
        }

        function log(text) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<br><span style="color:#555">[情报]</span> ${text}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        renderSVGBoard();
        createDOMGrid();
        
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'replay') {
            initReplayMode();
        } else {
            initBoard();
            initNetwork();
            updateStatsUI();
        }
    </script>
</body>
